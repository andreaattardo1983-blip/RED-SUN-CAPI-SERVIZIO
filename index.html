<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Hub — Dashboard Orizzontale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STORAGE_KEY = "excel_hub_horizontal_v1";

    function createSampleWorkbookBase64() {
      const wb = XLSX.utils.book_new();
      const rows = [
        ["Report Giornaliero", "", "", ""],
        ["Articolo", "Quantità", "Prezzo Unitario", "Note"],
        ["Capi Servizio A", 12, 18.5, "Pronto"],
        ["Capi Servizio B", 8, 24.0, "In lavorazione"],
        ["Capi Servizio C", 15, 14.2, "Consegnato"]
      ];
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 3 } }];
      ws["!cols"] = [{ wch: 24 }, { wch: 14 }, { wch: 18 }, { wch: 22 }];
      ws["!rows"] = [{ hpt: 28 }, { hpt: 22 }, { hpt: 20 }, { hpt: 20 }, { hpt: 20 }];
      XLSX.utils.book_append_sheet(wb, ws, "Foglio1");
      return XLSX.write(wb, { type: "base64", bookType: "xlsx" });
    }

    function createEmptyWorkbookBase64(title = "Foglio1") {
      const wb = XLSX.utils.book_new();
      const rows = Array.from({ length: 12 }, (_, r) =>
        Array.from({ length: 6 }, (_, c) => (r === 0 ? `Colonna ${c + 1}` : ""))
      );
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws["!cols"] = Array.from({ length: 6 }, () => ({ wch: 18 }));
      ws["!rows"] = Array.from({ length: 12 }, () => ({ hpt: 22 }));
      XLSX.utils.book_append_sheet(wb, ws, "Foglio1");
      return XLSX.write(wb, { type: "base64", bookType: "xlsx" });
    }

    function getDefaultTiles() {
      const sampleB64 = createSampleWorkbookBase64();
      return [
        {
          id: "tile-1",
          title: "File Esempio",
          fileName: "Esempio_Layout.xlsx",
          folderName: "Excel_Aggiornati",
          updatedAt: "19/11",
          hasFile: true,
          workbookBase64: sampleB64
        },
        {
          id: "tile-2",
          title: "File 2",
          fileName: "File_2.xlsx",
          folderName: "Excel_Aggiornati",
          updatedAt: "",
          hasFile: false,
          workbookBase64: null
        },
        {
          id: "tile-3",
          title: "File 3",
          fileName: "File_3.xlsx",
          folderName: "Excel_Aggiornati",
          updatedAt: "",
          hasFile: false,
          workbookBase64: null
        },
        {
          id: "tile-4",
          title: "File 4",
          fileName: "File_4.xlsx",
          folderName: "Excel_Aggiornati",
          updatedAt: "",
          hasFile: false,
          workbookBase64: null
        },
        {
          id: "tile-5",
          title: "File 5",
          fileName: "File_5.xlsx",
          folderName: "Excel_Aggiornati",
          updatedAt: "",
          hasFile: false,
          workbookBase64: null
        },
        {
          id: "tile-6",
          title: "File 6",
          fileName: "File_6.xlsx",
          folderName: "Excel_Aggiornati",
          updatedAt: "",
          hasFile: false,
          workbookBase64: null
        }
      ];
    }

    function App() {
      const [tiles, setTiles] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return getDefaultTiles();
      });

      const [activeTileId, setActiveTileId] = useState(null);
      const [sheetNames, setSheetNames] = useState([]);
      const [currentSheet, setCurrentSheet] = useState("");
      const [gridData, setGridData] = useState([]);
      const [merges, setMerges] = useState([]);
      const [colWidths, setColWidths] = useState([]);
      const [rowHeights, setRowHeights] = useState([]);
      const [editFileName, setEditFileName] = useState("");
      const [editFolderName, setEditFolderName] = useState("Excel_Aggiornati");
      const [dirHandle, setDirHandle] = useState(null);
      const [statusMsg, setStatusMsg] = useState("");

      const fileInputRefs = useRef({});
      const activeTile = tiles.find((t) => t.id === activeTileId) || null;

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tiles));
        } catch (e) {}
      }, [tiles]);

      const notify = (msg) => {
        setStatusMsg(msg);
        setTimeout(() => {
          setStatusMsg((prev) => (prev === msg ? "" : prev));
        }, 3500);
      };

      const addTile = () => {
        const nextNum = tiles.length + 1;
        const newTile = {
          id: `tile-${Date.now()}`,
          title: `File ${nextNum}`,
          fileName: `File_${nextNum}.xlsx`,
          folderName: "Excel_Aggiornati",
          updatedAt: "",
          hasFile: false,
          workbookBase64: null
        };
        setTiles((prev) => [...prev, newTile]);
        notify("Nuovo riquadro aggiunto.");
      };

      const updateTileTitle = (id, newTitle) => {
        const cleanTitle = newTitle;
        const safeName =
          (cleanTitle.trim() || "Foglio_Excel")
            .replace(/[\\/:*?"<>|]+/g, "_")
            .replace(/\s+/g, "_") + ".xlsx";

        setTiles((prev) =>
          prev.map((t) =>
            t.id === id
              ? {
                  ...t,
                  title: cleanTitle,
                  fileName: t.hasFile ? t.fileName : safeName
                }
              : t
          )
        );
      };

      const handleFileUpload = (id, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: "array" });
          const b64 = XLSX.write(wb, { type: "base64", bookType: "xlsx" });
          const now = new Date();
          const dateLabel = `${String(now.getDate()).padStart(2, "0")}/${String(
            now.getMonth() + 1
          ).padStart(2, "0")}`;

          setTiles((prev) =>
            prev.map((t) =>
              t.id === id
                ? {
                    ...t,
                    title: t.title.startsWith("File ") ? file.name.replace(/\.[^/.]+$/, "") : t.title,
                    fileName: file.name.endsWith(".xlsx") ? file.name : `${file.name.replace(/\.[^/.]+$/, "")}.xlsx`,
                    updatedAt: dateLabel,
                    hasFile: true,
                    workbookBase64: b64
                  }
                : t
            )
          );
          notify(`Caricato "${file.name}".`);
        };
        reader.readAsArrayBuffer(file);
      };

      const loadSheetFromBase64 = (b64, targetSheet = null) => {
        const wb = XLSX.read(b64, { type: "base64" });
        const names = wb.SheetNames || ["Foglio1"];
        const chosen = targetSheet && names.includes(targetSheet) ? targetSheet : names[0];
        const ws = wb.Sheets[chosen];
        const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
        const maxCols = Math.max(
          6,
          ...rawRows.map((r) => (Array.isArray(r) ? r.length : 0))
        );
        const totalRows = Math.max(12, rawRows.length);
        const normalized = Array.from({ length: totalRows }, (_, r) =>
          Array.from({ length: maxCols }, (_, c) =>
            rawRows[r] && rawRows[r][c] !== undefined ? String(rawRows[r][c]) : ""
          )
        );

        const colsInfo = Array.from({ length: maxCols }, (_, c) => {
          const w = ws["!cols"] && ws["!cols"][c] && ws["!cols"][c].wch;
          return Math.max(110, (w || 16) * 8);
        });

        const rowsInfo = Array.from({ length: totalRows }, (_, r) => {
          const h = ws["!rows"] && ws["!rows"][r] && ws["!rows"][r].hpt;
          return Math.max(30, (h || 20) * 1.35);
        });

        setSheetNames(names);
        setCurrentSheet(chosen);
        setGridData(normalized);
        setMerges(ws["!merges"] || []);
        setColWidths(colsInfo);
        setRowHeights(rowsInfo);
      };

      const openTileEditor = (tile) => {
        let b64 = tile.workbookBase64;
        if (!b64) {
          b64 = createEmptyWorkbookBase64(tile.title);
        }
        setActiveTileId(tile.id);
        setEditFileName(tile.fileName || "Foglio_Aggiornato.xlsx");
        setEditFolderName(tile.folderName || "Excel_Aggiornati");
        loadSheetFromBase64(b64);
      };

      const buildUpdatedWorkbookBase64 = () => {
        const baseB64 = activeTile && activeTile.workbookBase64
          ? activeTile.workbookBase64
          : createEmptyWorkbookBase64();
        const wb = XLSX.read(baseB64, { type: "base64" });
        const ws = XLSX.utils.aoa_to_sheet(gridData);
        if (merges && merges.length > 0) {
          ws["!merges"] = merges;
        }
        ws["!cols"] = colWidths.map((px) => ({ wch: Math.max(10, Math.round(px / 8)) }));
        ws["!rows"] = rowHeights.map((px) => ({ hpt: Math.max(18, Math.round(px / 1.35)) }));
        wb.Sheets[currentSheet || "Foglio1"] = ws;
        return XLSX.write(wb, { type: "base64", bookType: "xlsx" });
      };

      const persistChangesInTile = () => {
        if (!activeTile) return;
        const updatedB64 = buildUpdatedWorkbookBase64();
        const cleanFile =
          (editFileName.trim() || "Foglio_Aggiornato.xlsx").endsWith(".xlsx")
            ? editFileName.trim()
            : `${(editFileName.trim() || "Foglio_Aggiornato")}.xlsx`;
        const now = new Date();
        const dateLabel = `${String(now.getDate()).padStart(2, "0")}/${String(
          now.getMonth() + 1
        ).padStart(2, "0")}`;

        setTiles((prev) =>
          prev.map((t) =>
            t.id === activeTile.id
              ? {
                  ...t,
                  fileName: cleanFile,
                  folderName: editFolderName.trim() || "Excel_Aggiornati",
                  updatedAt: dateLabel,
                  hasFile: true,
                  workbookBase64: updatedB64
                }
              : t
          )
        );
        return { updatedB64, cleanFile };
      };

      const handleCellChange = (rIdx, cIdx, val) => {
        setGridData((prev) =>
          prev.map((row, r) =>
            r === rIdx ? row.map((cell, c) => (c === cIdx ? val : cell)) : row
          )
        );
      };

      const addRow = () => {
        const cols = gridData[0] ? gridData[0].length : 6;
        setGridData((prev) => [...prev, Array.from({ length: cols }, () => "")]);
        setRowHeights((prev) => [...prev, 32]);
      };

      const addCol = () => {
        setGridData((prev) => prev.map((row) => [...row, ""]));
        setColWidths((prev) => [...prev, 130]);
      };

      const chooseFolder = async () => {
        if (!window.showDirectoryPicker) {
          notify("Il browser non supporta la scelta diretta della cartella: verrà usato il download standard.");
          return;
        }
        try {
          const handle = await window.showDirectoryPicker({ mode: "readwrite" });
          setDirHandle(handle);
          notify(`Cartella collegata: ${handle.name}`);
        } catch (err) {
          if (err.name !== "AbortError") {
            notify("Impossibile accedere alla cartella selezionata.");
          }
        }
      };

      const saveToFolderOrDownload = async () => {
        const saved = persistChangesInTile();
        if (!saved) return;
        const { updatedB64, cleanFile } = saved;
        const binaryString = atob(updatedB64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        const blob = new Blob([bytes], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        });

        try {
          if (dirHandle) {
            const subFolderName = (editFolderName || "").trim();
            let targetDir = dirHandle;
            if (subFolderName && subFolderName !== dirHandle.name) {
              targetDir = await dirHandle.getDirectoryHandle(subFolderName, { create: true });
            }
            const fileHandle = await targetDir.getFileHandle(cleanFile, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(blob);
            await writable.close();
            notify(`Salvato "${cleanFile}" nella cartella.`);
            return;
          }
        } catch (err) {
          notify("Salvataggio diretto non riuscito, avvio download standard.");
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = cleanFile;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        notify(`Scaricato "${cleanFile}".`);
      };

      const shareByEmail = () => {
        const saved = persistChangesInTile();
        const fileLabel = saved ? saved.cleanFile : editFileName || "Foglio.xlsx";
        const subject = encodeURIComponent(`Aggiornamento file Excel: ${fileLabel}`);
        const body = encodeURIComponent(
          `Ciao,\n\nho aggiornato il file "${fileLabel}" (cartella: ${editFolderName || "Excel_Aggiornati"}).\nRicordati di allegare il file esportato.`
        );
        window.location.href = `mailto:?subject=${subject}&body=${body}`;
      };

      return (
        <div className="min-h-screen w-full bg-slate-100 text-slate-900 px-4 sm:px-6 lg:px-8 py-6">
          <div className="w-full max-w-[1600px] mx-auto">
            {statusMsg && (
              <div className="mb-4 rounded-xl bg-slate-900 text-white px-4 py-2.5 text-sm font-medium shadow">
                {statusMsg}
              </div>
            )}

            {!activeTile ? (
              <div>
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm px-6 py-4 mb-6 flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <div className="w-11 h-11 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
                      XH
                    </div>
                    <div>
                      <h1 className="text-xl font-bold text-slate-900 leading-tight">
                        Excel Hub
                      </h1>
                      <p className="text-sm text-slate-500">
                        Vista orizzontale — rinomina, carica o apri un riquadro
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    <span className="text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg">
                      {tiles.length} riquadri
                    </span>
                    <button
                      type="button"
                      onClick={addTile}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition cursor-pointer"
                    >
                      + Riquadro
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                  {tiles.map((tile) => (
                    <div
                      key={tile.id}
                      className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between gap-4 hover:border-slate-300 transition"
                    >
                      <div className="flex items-center justify-between gap-2">
                        {tile.hasFile ? (
                          <span className="inline-flex items-center gap-1.5 text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">
                            ● Pronto
                          </span>
                        ) : (
                          <span className="inline-flex items-center gap-1.5 text-xs font-medium bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">
                            ○ Vuoto
                          </span>
                        )}

                        <button
                          type="button"
                          onClick={() => fileInputRefs.current[tile.id]?.click()}
                          className="text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition cursor-pointer"
                        >
                          ↑ File
                        </button>
                        <input
                          ref={(el) => (fileInputRefs.current[tile.id] = el)}
                          type="file"
                          accept=".xlsx,.xls,.csv"
                          className="hidden"
                          onChange={(e) => {
                            handleFileUpload(tile.id, e.target.files?.[0]);
                            e.target.value = "";
                          }}
                        />
                      </div>

                      <div className="text-center space-y-2">
                        <input
                          type="text"
                          value={tile.title}
                          onChange={(e) => updateTileTitle(tile.id, e.target.value)}
                          className="w-full text-center font-bold text-base text-slate-900 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-slate-900"
                          placeholder="Nome riquadro"
                        />
                        <p className="text-xs text-slate-500 truncate">
                          {tile.hasFile
                            ? `${tile.fileName}${tile.updatedAt ? ` • ${tile.updatedAt}` : ""}`
                            : "Scrivi il nome o carica .xlsx"}
                        </p>
                      </div>

                      <button
                        type="button"
                        onClick={() => openTileEditor(tile)}
                        className="w-full bg-slate-950 hover:bg-slate-800 text-white font-semibold text-sm py-2.5 rounded-xl transition cursor-pointer"
                      >
                        Apri
                      </button>
                    </div>
                  ))}
                </div>

                <div className="mt-6 bg-white rounded-xl border border-slate-200 px-5 py-3 flex items-center justify-between text-xs text-slate-500">
                  <span>Le modifiche restano in locale finché non esporti</span>
                  <span className="font-semibold text-slate-700">{tiles.length} riquadri</span>
                </div>
              </div>
            ) : (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 space-y-5">
                <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 pb-4">
                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => {
                        persistChangesInTile();
                        setActiveTileId(null);
                      }}
                      className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-sm px-3.5 py-2 rounded-xl transition cursor-pointer"
                    >
                      ← Riquadri
                    </button>
                    <div>
                      <h2 className="text-lg font-bold text-slate-900">{activeTile.title}</h2>
                      <p className="text-xs text-slate-500">Modifica celle mantenendo la struttura del foglio</p>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      type="button"
                      onClick={addRow}
                      className="text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-2 rounded-lg cursor-pointer"
                    >
                      + Riga
                    </button>
                    <button
                      type="button"
                      onClick={addCol}
                      className="text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-2 rounded-lg cursor-pointer"
                    >
                      + Colonna
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">
                      Nome file
                    </label>
                    <input
                      type="text"
                      value={editFileName}
                      onChange={(e) => setEditFileName(e.target.value)}
                      className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">
                      Cartella
                    </label>
                    <input
                      type="text"
                      value={editFolderName}
                      onChange={(e) => setEditFolderName(e.target.value)}
                      className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm"
                    />
                  </div>
                  <div className="flex items-end">
                    <button
                      type="button"
                      onClick={chooseFolder}
                      className="w-full bg-white hover:bg-slate-100 border border-slate-300 text-slate-800 font-semibold text-sm py-2 px-3 rounded-lg cursor-pointer"
                    >
                      📁 Scegli/Crea Cartella
                    </button>
                  </div>
                  <div className="flex items-end gap-2">
                    <button
                      type="button"
                      onClick={saveToFolderOrDownload}
                      className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm py-2 px-3 rounded-lg cursor-pointer"
                    >
                      ⬇ Salva in Cartella
                    </button>
                    <button
                      type="button"
                      onClick={shareByEmail}
                      className="bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm py-2 px-3 rounded-lg cursor-pointer"
                    >
                      ✉ Email
                    </button>
                  </div>
                </div>

                {sheetNames.length > 1 && (
                  <div className="flex flex-wrap gap-2">
                    {sheetNames.map((name) => (
                      <button
                        key={name}
                        type="button"
                        onClick={() => {
                          persistChangesInTile();
                          loadSheetFromBase64(buildUpdatedWorkbookBase64(), name);
                        }}
                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer ${
                          name === currentSheet
                            ? "bg-slate-900 text-white"
                            : "bg-slate-100 text-slate-700 hover:bg-slate-200"
                        }`}
                      >
                        {name}
                      </button>
                    ))}
                  </div>
                )}

                <div className="overflow-auto max-h-[65vh] border border-slate-200 rounded-xl">
                  <table className="border-collapse bg-white">
                    <tbody>
                      {gridData.map((row, rIdx) => (
                        <tr
                          key={rIdx}
                          style={{ height: `${rowHeights[rIdx] || 32}px` }}
                        >
                          {row.map((cell, cIdx) => (
                            <td
                              key={cIdx}
                              style={{ width: `${colWidths[cIdx] || 130}px`, minWidth: `${colWidths[cIdx] || 130}px` }}
                              className="border border-slate-200 p-0"
                            >
                              <input
                                type="text"
                                value={cell}
                                onChange={(e) => handleCellChange(rIdx, cIdx, e.target.value)}
                                className={`w-full h-full px-2.5 py-1.5 text-sm focus:outline-none focus:bg-amber-50 ${
                                  rIdx === 0 ? "font-semibold bg-slate-50" : "bg-white"
                                }`}
                              />
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>

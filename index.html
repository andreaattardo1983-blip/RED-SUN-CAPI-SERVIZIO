    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .press-btn {
      transition: transform 120ms ease, background-color 150ms ease, box-shadow 150ms ease;
    }
    .press-btn:active {
      transform: scale(0.97);
    }
    .attendance-scroll::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    .attendance-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .attendance-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }
  </style>

    // Codici presenze mensili

    // Categorie cartelle dell'Archivio Direzione & Vice Direttore
    const ARCHIVE_CATEGORIES = [

      { id: "manutenzione_ospiti", label: "Manutenzione & Segnalazioni", badgeClass: "bg-violet-100 text-violet-900 border-violet-300", icon: "🛠️" },

    // Utility data e ora correnti con fallback sicuro
    function getTodayISO() {
      try {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      } catch (err) {
        return "2026-11-20";
      }
    }

    function getCurrentYearMonth() {
      return getTodayISO().slice(0, 7);
    }

    function getCurrentTimeHHMM() {
      try {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        return `${hh}:${mm}`;
      } catch (err) {
        return "11:30";
      }
    }

    function formatDateTimeStamp(dateISO, timeHHMM) {
      const d = dateISO || getTodayISO();
      const t = timeHHMM || getCurrentTimeHHMM();
      return `${d} ${t}`;
    }

    function formatPublishedBadge(dateISO, timeHHMM) {
      const d = dateISO || getTodayISO();
      const t = timeHHMM || getCurrentTimeHHMM();
      return `📅 ${d} • 🕒 ${t}`;
    }

    function getDaysInMonth(ym) {
      try {
        const [y, m] = (ym || getCurrentYearMonth()).split("-").map(Number);
        if (!y || !m) return 30;
        return new Date(y, m, 0).getDate();
      } catch (err) {
        return 30;
      }
    }

    // Stato iniziale dell'applicazione
    const initialState = {

      activeSection: null,
      isAuthenticated: false,
      sectorCredentials: {

        vice_director: { username: "vicedirettore", password: "" },

        cucina: { username: "cucina", password: "" },

        sala: { username: "sala", password: "" },

        manutenzione: { username: "manutenzione", password: "" }

        { id: "st_3", name: "Lorenzo Rinaldi", role: "Executive Chef", deptId: "cucina" },

      ],

        }

        {
          id: "arc_1",

        },
        {

          date: getTodayISO(),
          time: "09:15",
          category: "cambi_camera",
          title: "Cambio Cam. 305 → Cam. 412",
          detail: "Upgrade approvato dalla Direzione; Governante e Ricevimento allineati.",
          authorRole: "Vice Direttore"
        },
        {
          id: "arc_3",

          date: getTodayISO(),
          time: "09:30",
          category: "movimento_pasti",

        {

          detail: "Richiesta cuscino extra e silenzio lato cortile (Risolta).",
          authorRole: "Ricevimento"
        }
      ]
    };

    function seedDefaultAttendance(targetState) {
      const ym = targetState.selectedMonth || getCurrentYearMonth();
      const days = getDaysInMonth(ym);
      targetState.staff.forEach((member, idx) => {
        for (let d = 1; d <= Math.min(days, 14); d++) {
          const key = `${ym}__${member.id}__${d}`;
          if (!targetState.monthlyAttendance[key]) {
            targetState.monthlyAttendance[key] = (d + idx) % 7 === 0 ? "R" : "P";
          }
        }
      });
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const fresh = JSON.parse(JSON.stringify(initialState));
          seedDefaultAttendance(fresh);
          return fresh;
        }
        const parsed = JSON.parse(raw);
        const merged = {
          ...JSON.parse(JSON.stringify(initialState)),
          ...parsed,
          isAuthenticated: false,
          pendingRoleId: null,
          passwordDraft: "",
          passwordError: "",
          loginPasswordDraft: "",
          loginError: "",
          sectorCredentials: {
            ...initialState.sectorCredentials,
            ...(parsed?.sectorCredentials || {})
          },
          complaints: Array.isArray(parsed?.complaints)
            ? parsed.complaints.map((c) => {
                const st = c?.status;
                if (st === "Gestita") return { ...c, status: "Risolta" };
                if (st === "Da gestire") return { ...c, status: "Aperta" };
                return { ...c, status: ["Aperta", "In lavorazione", "Risolta"].includes(st) ? st : "Aperta" };
              })
            : initialState.complaints,
          archiveEntries: Array.isArray(parsed?.archiveEntries) ? parsed.archiveEntries : initialState.archiveEntries
        };
        if (Object.keys(merged.monthlyAttendance).length === 0) {
          seedDefaultAttendance(merged);
        }
        return merged;
      } catch (err) {
        const fallback = JSON.parse(JSON.stringify(initialState));
        seedDefaultAttendance(fallback);
        return fallback;
      }
    }

    let state = loadState();
    let isArchivingInProgress = false;

    function saveState() {
      try {
        const toSave = { ...state };
        delete toSave.isAuthenticated;
        delete toSave.pendingRoleId;
        delete toSave.passwordDraft;
        delete toSave.passwordError;
        delete toSave.loginPasswordDraft;
        delete toSave.loginError;
        delete toSave.credentialDraftsByKey;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      } catch (err) {
        console.warn("Salvataggio locale non riuscito:", err);
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showInfoToast(message) {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const el = document.createElement("div");
      el.className = "pointer-events-auto bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-lg border border-slate-700 transition-opacity duration-300";
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 300);
      }, 2400);
    }

    // Helper ruoli e permessi operativi
    function getCurrentRole() {
      return ROLES.find((r) => r.id === state.activeRole) || ROLES[0];
    }

    function getRoleSectorKey(roleId) {
      if (roleId === "director" || roleId === "vice_director") return roleId;
      return String(roleId || "").replace(/^dept_/, "");
    }

    function getSectorCredential(key) {
      return state.sectorCredentials?.[key] || { username: key, password: "" };
    }

    function getSectorPassword(key) {
      return (getSectorCredential(key).password || "").trim();
    }

    function canViewAllDepartments() {
      const role = getCurrentRole();
      return role.id === "director" || role.id === "vice_director";
    }

    function canManageSectorCredentials() {
      return canViewAllDepartments();
    }

    function canWriteServiceNotes() {
      const role = getCurrentRole();
      return role.deptId !== "manutenzione";
    }

    function canDeleteServiceNotes() {
      const role = getCurrentRole();
      return role.deptId !== "manutenzione";
    }

    function canCreateMaintenanceTickets() {
      const role = getCurrentRole();
      return role.deptId !== "manutenzione";
    }

    function canSendReceptionRoomNotices() {
      const role = getCurrentRole();
      return canViewAllDepartments() || role.deptId === "ricevimento";
    }

    function canViewReceptionRoomNotices() {
      const role = getCurrentRole();
      return canViewAllDepartments() || role.deptId === "ricevimento" || role.deptId === "governante";
    }

    function canEditMealsSection() {
      const role = getCurrentRole();
      return canViewAllDepartments() || ["ricevimento", "cucina", "sala"].includes(role.deptId);
    }

    function getAvailableSectionsForRole() {
      const role = getCurrentRole();
      if (role.id === "director" || role.id === "vice_director") {
        return ["attendance", "meals", "notes", "maintenance", "complaints", "archive"];
      }
      if (role.deptId === "ricevimento") {
        return ["attendance", "meals", "notes", "maintenance", "complaints"];
      }
      if (["cucina", "sala", "economato"].includes(role.deptId)) {
        return ["attendance", "meals", "notes", "maintenance"];
      }
      if (role.deptId === "governante") {
        return ["attendance", "meals", "notes", "maintenance", "complaints"];
      }
      return ["attendance", "notes", "maintenance"];
    }

    function syncActiveSectionWithRole() {
      const allowed = getAvailableSectionsForRole();
      if (state.activeSection && !allowed.includes(state.activeSection)) {
        state.activeSection = null;
      }
    }

    function getVisibleDepartments() {
      if (canViewAllDepartments()) {
        return DEPARTMENTS;
      }
      const role = getCurrentRole();
      if (role.deptId === "cucina") {
        return DEPARTMENTS.filter((d) => d.id === "cucina" || d.id === "plonge");
      }
      return DEPARTMENTS.filter((d) => d.id === role.deptId);
    }

    function getDayMealMovement(dateISO) {
      let entry = state.mealMovements.find((m) => m.date === dateISO);
      if (!entry) {
        entry = {
          id: `meal_${dateISO}`,
          date: dateISO,
          breakfast: 0,
          lunch: 0,
          dinner: 0,
          intolerances: "",
          packetLunch: []
        };
        state.mealMovements.push(entry);
      }
      if (!Array.isArray(entry.packetLunch)) {
        entry.packetLunch = [];
      }
      return entry;
    }

    function getTotalPacketLunchCount(entry) {
      return (entry?.packetLunch || []).reduce((sum, item) => sum + (Number(item.count) || 0), 0);
    }

    function isAlreadyArchivedSource(sourceRef) {
      if (!sourceRef) return false;
      return (state.archiveEntries || []).some((e) => e.sourceRef === sourceRef);
    }

    // Registra una voce nell'archivio Direzione evitando duplicati per sourceRef
    function recordInDirectionArchive({ sourceRef = null, date = null, time = null, category, title, detail, authorRole = null }) {
      if (!category) return;
      if (sourceRef && isAlreadyArchivedSource(sourceRef)) {
        return;
      }
      if (!Array.isArray(state.archiveEntries)) {
        state.archiveEntries = [];
      }
      const cleanDate = date || state.selectedDate || getTodayISO();
      const cleanTime = time || getCurrentTimeHHMM();
      state.archiveEntries.unshift({
        id: `arc_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        sourceRef: sourceRef || null,
        date: cleanDate,
        time: cleanTime,
        category,
        title: (title || "Informazione operativa").trim(),
        detail: (detail || title || "").trim(),
        authorRole: authorRole || getCurrentRole().label
      });
    }

    function getSortedArchiveEntries() {
      const entries = Array.isArray(state.archiveEntries) ? [...state.archiveEntries] : [];
      return entries.sort((a, b) => {
        const stampA = formatDateTimeStamp(a.date, a.time);
        const stampB = formatDateTimeStamp(b.date, b.time);
        return stampB.localeCompare(stampA);
      });
    }

    // Azioni centralizzate dell'applicazione
    const actions = {
      updateLoginUsername(val) {
        state.loginUsernameDraft = val;
        state.loginError = "";
      },
      updateLoginPassword(val) {
        state.loginPasswordDraft = val;
        state.loginError = "";
      },
      quickFillLogin(sectorKey) {
        const cred = getSectorCredential(sectorKey);
        state.loginUsernameDraft = cred.username || sectorKey;
        state.loginPasswordDraft = "";
        state.loginError = "";
        render();
        setTimeout(() => {
          const passEl = document.getElementById("login-password-input");
          if (passEl) passEl.focus();
        }, 20);
      },
      submitInitialLogin(event) {
        event.preventDefault();
        const enteredUser = (state.loginUsernameDraft || "").trim().toLowerCase();
        const enteredPass = (state.loginPasswordDraft || "").trim();

        if (!enteredUser) {
          state.loginError = "Inserisci lo username del tuo settore.";
          render();
          return;
        }

        const matchedEntry = Object.entries(state.sectorCredentials || {}).find(
          ([key, cred]) => (cred?.username || key).trim().toLowerCase() === enteredUser
        );

        if (!matchedEntry) {
          state.loginError = "Username non riconosciuto. Tocca un settore qui sotto o verifica con la Direzione.";
          render();
          return;
        }

        const [sectorKey, cred] = matchedEntry;
        const expectedPass = (cred?.password || "").trim();
        if (expectedPass && enteredPass !== expectedPass) {
          state.loginError = "Password errata per questo settore.";
          render();
          return;
        }

        const targetRoleId =
          sectorKey === "director" || sectorKey === "vice_director" ? sectorKey : `dept_${sectorKey}`;

        state.activeRole = targetRoleId;
        state.isAuthenticated = true;
        state.activeSection = null;
        state.loginPasswordDraft = "";
        state.loginError = "";
        state.lastSelectedCell = null;
        render();
        showInfoToast(`Accesso effettuato come ${getCurrentRole().label}`);
      },
      logout() {
        state.isAuthenticated = false;
        state.activeSection = null;
        state.pendingRoleId = null;
        state.loginPasswordDraft = "";
        state.loginError = "";
        render();
      },
      requestRoleChange(newRoleId) {
        if (newRoleId === state.activeRole) return;
        const sectorKey = getRoleSectorKey(newRoleId);
        const expectedPass = getSectorPassword(sectorKey);
        if (!expectedPass) {
          state.activeRole = newRoleId;
          state.pendingRoleId = null;
          state.passwordDraft = "";
          state.passwordError = "";
          state.lastSelectedCell = null;
          syncActiveSectionWithRole();
          render();
          showInfoToast(`Profilo attivo: ${getCurrentRole().label}`);
          return;
        }
        state.pendingRoleId = newRoleId;
        state.passwordDraft = "";
        state.passwordError = "";
        render();
      },
      cancelRoleChange() {
        state.pendingRoleId = null;
        state.passwordDraft = "";
        state.passwordError = "";
        render();
      },
      updatePendingPassword(val) {
        state.passwordDraft = val;
        state.passwordError = "";
      },
      confirmRoleChange(event) {
        event.preventDefault();
        if (!state.pendingRoleId) return;
        const sectorKey = getRoleSectorKey(state.pendingRoleId);
        const expectedPass = getSectorPassword(sectorKey);
        if ((state.passwordDraft || "").trim() !== expectedPass) {
          state.passwordError = "PIN / Password non corretti.";
          render();
          return;
        }
        state.activeRole = state.pendingRoleId;
        state.pendingRoleId = null;
        state.passwordDraft = "";
        state.passwordError = "";
        state.lastSelectedCell = null;
        syncActiveSectionWithRole();
        render();
        showInfoToast(`Profilo attivo: ${getCurrentRole().label}`);
      },
      updateCredentialDraft(key, field, value) {
        if (!state.credentialDraftsByKey[key]) {
          const cur = getSectorCredential(key);
          state.credentialDraftsByKey[key] = {
            username: cur.username || key,
            password: cur.password || ""
          };
        }
        state.credentialDraftsByKey[key][field] = value;
      },
      saveSectorCredential(key) {
        if (!canManageSectorCredentials()) {
          showInfoToast("Solo Direttore e Vice Direttore possono modificare le credenziali.");
          return;
        }
        const current = getSectorCredential(key);
        const draft = state.credentialDraftsByKey[key] || current;
        const cleanUser = (draft.username || key).trim();
        const cleanPass = (draft.password || "").trim();
        if (!cleanUser) {
          showInfoToast("Lo username non può essere vuoto.");
          return;
        }
        state.sectorCredentials[key] = {
          username: cleanUser,
          password: cleanPass
        };
        delete state.credentialDraftsByKey[key];
        saveState();
        render();
        showInfoToast(`Credenziali aggiornate per ${cleanUser}.`);
      },
      openSection(sectionId) {
        const allowed = getAvailableSectionsForRole();
        if (!allowed.includes(sectionId)) {
          showInfoToast("Sezione non abilitata per questo profilo.");
          return;
        }
        state.activeSection = sectionId;
        if (sectionId === "archive") {
          state.archiveFilterCategory = null;
          state.archiveQuickTool = null;
        }
        render();
      },
      goHome() {
        state.activeSection = null;
        state.lastSelectedCell = null;
        state.archiveFilterCategory = null;
        state.archiveQuickTool = null;
        render();
      },
      setSelectedDate(dateISO) {
        if (!dateISO) return;
        state.selectedDate = dateISO;
        saveState();
        render();
      },
      setSelectedMonth(ym) {
        if (!ym) return;
        state.selectedMonth = ym;
        saveState();
        render();
      },
      selectBrushCode(code) {
        state.selectedBrushCode = code;
        if (code === "CLEAR" && state.lastSelectedCell) {
          const { staffId, day } = state.lastSelectedCell;
          const key = `${state.selectedMonth}__${staffId}__${day}`;
          delete state.monthlyAttendance[key];
          saveState();
          showInfoToast("Cella svuotata.");
        }
        render();
      },
      clearSelectedCell() {
        if (!state.lastSelectedCell) {
          state.selectedBrushCode = "CLEAR";
          render();
          showInfoToast("Modalità Svuota attiva: tocca una cella per cancellarla.");
          return;
        }
        const { staffId, day } = state.lastSelectedCell;
        const key = `${state.selectedMonth}__${staffId}__${day}`;
        delete state.monthlyAttendance[key];
        saveState();
        render();
        showInfoToast("Cella selezionata svuotata.");
      },
      setAttendanceCell(staffId, day) {
        state.lastSelectedCell = { staffId, day };
        const key = `${state.selectedMonth}__${staffId}__${day}`;
        if (state.selectedBrushCode === "CLEAR") {
          delete state.monthlyAttendance[key];
        } else {
          state.monthlyAttendance[key] = state.selectedBrushCode || "P";
        }
        saveState();
        render();
      },
      addStaffMember(event) {
        event.preventDefault();
        const nameInput = document.getElementById("new-staff-name");
        const roleInput = document.getElementById("new-staff-role");
        const deptSelect = document.getElementById("new-staff-dept");
        const name = (nameInput?.value || "").trim();
        const role = (roleInput?.value || "").trim() || "Operatore";
        const deptId = deptSelect?.value || getVisibleDepartments()[0]?.id || "ricevimento";
        if (!name) {
          showInfoToast("Inserisci il nome del collaboratore.");
          return;
        }
        state.staff.push({
          id: `st_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          name,
          role,
          deptId
        });
        saveState();
        render();
        showInfoToast(`${name} aggiunto al reparto.`);
      },
      addStaffMemberFromDirection(event) {
        event.preventDefault();
        if (!canViewAllDepartments()) {
          showInfoToast("Operazione riservata a Direttore e Vice Direttore.");
          return;
        }
        const nameInput = document.getElementById("dir-staff-name");
        const roleInput = document.getElementById("dir-staff-role");
        const deptSelect = document.getElementById("dir-staff-dept");
        const name = (nameInput?.value || "").trim();
        const role = (roleInput?.value || "").trim() || "Operatore";
        const deptId = deptSelect?.value || DEPARTMENTS[1]?.id || "ricevimento";
        if (!name) {
          showInfoToast("Inserisci il nome del collaboratore.");
          return;
        }
        state.staff.push({
          id: `st_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          name,
          role,
          deptId
        });
        saveState();
        render();
        showInfoToast(`${name} inserito in organico.`);
      },
      removeStaffMember(staffId) {
        if (!canViewAllDepartments()) {
          showInfoToast("Eliminazione riservata a Direttore e Vice Direttore.");
          return;
        }
        const member = state.staff.find((s) => s.id === staffId);
        state.staff = state.staff.filter((s) => s.id !== staffId);
        const prefix = `__${staffId}__`;
        Object.keys(state.monthlyAttendance || {}).forEach((k) => {
          if (k.includes(prefix)) {
            delete state.monthlyAttendance[k];
          }
        });
        if (state.lastSelectedCell && state.lastSelectedCell.staffId === staffId) {
          state.lastSelectedCell = null;
        }
        saveState();
        render();
        showInfoToast(member ? `${member.name} rimosso dall'organico.` : "Collaboratore eliminato.");
      },
      updateMealCounter(field, deltaOrValue, isDirect = false) {
        if (!canEditMealsSection()) return;
        const entry = getDayMealMovement(state.selectedDate);
        const current = Number(entry[field]) || 0;
        const next = isDirect ? Math.max(0, Number(deltaOrValue) || 0) : Math.max(0, current + deltaOrValue);
        entry[field] = next;
        const nowTime = getCurrentTimeHHMM();
        const totalPackets = getTotalPacketLunchCount(entry);
        recordInDirectionArchive({
          sourceRef: `meal_snapshot:${state.selectedDate}`,
          date: state.selectedDate,
          time: nowTime,
          category: "movimento_pasti",
          title: `Movimento Pasti (${state.selectedDate})`,
          detail: `Colazioni: ${Number(entry.breakfast) || 0} • Pranzi: ${Number(entry.lunch) || 0} • Cene: ${Number(entry.dinner) || 0} • Packet Lunch: ${totalPackets}`,
          authorRole: getCurrentRole().label
        });
        const existingSnap = (state.archiveEntries || []).find(
          (e) => e.sourceRef === `meal_snapshot:${state.selectedDate}`
        );
        if (existingSnap) {
          existingSnap.time = nowTime;
          existingSnap.detail = `Colazioni: ${Number(entry.breakfast) || 0} • Pranzi: ${Number(entry.lunch) || 0} • Cene: ${Number(entry.dinner) || 0} • Packet Lunch: ${totalPackets}`;
          existingSnap.authorRole = getCurrentRole().label;
        }
        saveState();
        render();
      },
      addPacketLunch(event) {
        event.preventDefault();
        if (!canEditMealsSection()) return;
        const room = (document.getElementById("pl-room")?.value || "").trim();
        const diet = document.getElementById("pl-diet")?.value || "Normale";
        const count = Math.max(1, Number(document.getElementById("pl-count")?.value) || 1);
        if (!room) {
          showInfoToast("Inserisci il numero camera per il Packet Lunch.");
          return;
        }
        const entry = getDayMealMovement(state.selectedDate);
        const plId = `pl_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const nowTime = getCurrentTimeHHMM();
        entry.packetLunch.push({
          id: plId,
          room,
          diet,
          count
        });
        recordInDirectionArchive({
          sourceRef: `packet_lunch:${plId}`,
          date: state.selectedDate,
          time: nowTime,
          category: "movimento_pasti",
          title: `Packet Lunch Cam. ${room}`,
          detail: `${diet} x${count} (Totale pasti giorno: Col. ${Number(entry.breakfast) || 0}, Pra. ${Number(entry.lunch) || 0}, Cen. ${Number(entry.dinner) || 0})`,
          authorRole: getCurrentRole().label
        });
        saveState();
        render();
        showInfoToast(`Packet lunch registrato per Cam. ${room}.`);
      },
      removePacketLunch(plId) {
        if (!canEditMealsSection()) return;
        const entry = getDayMealMovement(state.selectedDate);
        entry.packetLunch = entry.packetLunch.filter((item) => item.id !== plId);
        saveState();
        render();
      },
      addIntoleranceNotice(event) {
        event.preventDefault();
        if (!canSendReceptionRoomNotices()) {
          showInfoToast("Solo Ricevimento e Direzione possono inviare comunicazioni intolleranze.");
          return;
        }
        const room = (document.getElementById("intol-room")?.value || "").trim();
        const detail = (document.getElementById("intol-detail")?.value || "").trim();
        if (!room || !detail) {
          showInfoToast("Inserisci numero camera e dettaglio intolleranza.");
          return;
        }
        const noticeId = `int_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const nowTime = getCurrentTimeHHMM();
        const authorRole = getCurrentRole().label;
        state.intoleranceNotices.unshift({
          id: noticeId,
          date: state.selectedDate,
          time: nowTime,
          room,
          detail,
          authorRole
        });
        recordInDirectionArchive({
          sourceRef: `intolerance:${noticeId}`,
          date: state.selectedDate,
          time: nowTime,
          category: "pasti_intolleranze",
          title: `Intolleranza Cam. ${room}`,
          detail,
          authorRole
        });
        saveState();
        render();
        showInfoToast(`Intolleranza Cam. ${room} comunicata (${state.selectedDate} ${nowTime}).`);
      },
      deleteIntoleranceNotice(noticeId) {
        if (!canSendReceptionRoomNotices()) return;
        state.intoleranceNotices = state.intoleranceNotices.filter((n) => n.id !== noticeId);
        saveState();
        render();
      },
      addRoomChangeNotice(event) {
        event.preventDefault();
        if (!canSendReceptionRoomNotices()) {
          showInfoToast("Solo Ricevimento e Direzione possono inviare cambi camera.");
          return;
        }
        const fromRoom = (document.getElementById("rc-from")?.value || "").trim();
        const toRoom = (document.getElementById("rc-to")?.value || "").trim();
        const note = (document.getElementById("rc-note")?.value || "").trim() || "Cambio camera comunicato dal ricevimento";
        if (!fromRoom || !toRoom) {
          showInfoToast("Inserisci camera di partenza e nuova camera.");
          return;
        }
        const rcId = `rc_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const nowTime = getCurrentTimeHHMM();
        const authorRole = getCurrentRole().label;
        state.roomChangeNotices.unshift({
          id: rcId,
          date: state.selectedDate,
          time: nowTime,
          fromRoom,
          toRoom,
          note,
          authorRole
        });
        recordInDirectionArchive({
          sourceRef: `room_change:${rcId}`,
          date: state.selectedDate,
          time: nowTime,
          category: "cambi_camera",
          title: `Cambio Cam. ${fromRoom} → Cam. ${toRoom}`,
          detail: note,
          authorRole
        });
        saveState();
        render();
        showInfoToast(`Cambio camera ${fromRoom} → ${toRoom} salvato (${state.selectedDate} ${nowTime}).`);
      },
      deleteRoomChangeNotice(noticeId) {
        if (!canSendReceptionRoomNotices()) {
          showInfoToast("Operazione riservata a Ricevimento o Direzione.");
          return;
        }
        state.roomChangeNotices = state.roomChangeNotices.filter((n) => n.id !== noticeId);
        saveState();
        render();
        showInfoToast("Comunicazione cambio camera rimossa.");
      },
      toggleNoteAllDepts(checked) {
        state.noteSelectAllDepts = Boolean(checked);
        state.noteSelectedDeptIds = checked ? DEPARTMENTS.map((d) => d.id) : [];
        render();
      },
      toggleNoteSingleDept(deptId, checked) {
        const current = new Set(state.noteSelectedDeptIds || []);
        if (checked) {
          current.add(deptId);
        } else {
          current.delete(deptId);
        }
        state.noteSelectedDeptIds = Array.from(current);
        state.noteSelectAllDepts = state.noteSelectedDeptIds.length === DEPARTMENTS.length;
        render();
      },
      addServiceNote(event) {
        event.preventDefault();
        if (!canWriteServiceNotes()) {
          showInfoToast("La Manutenzione può solo leggere le note.");
          return;
        }
        const text = (document.getElementById("note-text")?.value || "").trim();
        if (!text) {
          showInfoToast("Scrivi il testo della nota di servizio.");
          return;
        }
        const role = getCurrentRole();
        let targetDeptIds = [];

        if (role.deptId === "governante") {
          targetDeptIds = ["governante", "ricevimento", "manutenzione", "direzione"];
        } else if (state.noteSelectAllDepts) {
          targetDeptIds = ["all"];
        } else {
          targetDeptIds = Array.from(new Set(state.noteSelectedDeptIds || []));
          if (role.deptId && !targetDeptIds.includes(role.deptId)) {
            targetDeptIds.push(role.deptId);
          }
          if (targetDeptIds.length === 0) {
            showInfoToast("Seleziona almeno un reparto destinatario.");
            return;
          }
        }

        const noteId = `note_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const nowTime = getCurrentTimeHHMM();
        state.serviceNotes.unshift({
          id: noteId,
          date: state.selectedDate,
          time: nowTime,
          deptId: targetDeptIds.includes("all") ? "all" : targetDeptIds[0],
          targetDeptIds,
          authorRole: role.label,
          text
        });
        const targetsLabel = targetDeptIds.includes("all")
          ? "Tutti i reparti"
          : targetDeptIds.map((id) => DEPARTMENTS.find((d) => d.id === id)?.name || id).join(", ");
        recordInDirectionArchive({
          sourceRef: `note:${noteId}`,
          date: state.selectedDate,
          time: nowTime,
          category: "ordini_servizio",
          title: `Nota di Servizio (${role.label} → ${targetsLabel})`,
          detail: text,
          authorRole: role.label
        });
        saveState();
        render();
        showInfoToast(`Nota pubblicata (${state.selectedDate} ${nowTime}).`);
      },
      deleteServiceNote(noteId) {
        if (!canDeleteServiceNotes()) {
          showInfoToast("La Manutenzione può solo leggere le note.");
          return;
        }
        state.serviceNotes = state.serviceNotes.filter((n) => n.id !== noteId);
        saveState();
        render();
        showInfoToast("Nota eliminata.");
      },
      addMaintenanceTicket(event) {
        event.preventDefault();
        if (!canCreateMaintenanceTickets()) {
          showInfoToast("I manutentori possono solo leggere e risolvere gli interventi.");
          return;
        }
        const roomOrArea = (document.getElementById("mnt-area")?.value || "").trim();
        const issue = (document.getElementById("mnt-issue")?.value || "").trim();
        if (!roomOrArea || !issue) {
          showInfoToast("Compila camera/zona e descrizione intervento.");
          return;
        }
        const mntId = `mnt_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const nowTime = getCurrentTimeHHMM();
        state.maintenanceTickets.unshift({
          id: mntId,
          date: state.selectedDate,
          time: nowTime,
          roomOrArea,
          issue,
          status: "Aperta"
        });
        recordInDirectionArchive({
          sourceRef: `maintenance:${mntId}`,
          date: state.selectedDate,
          time: nowTime,
          category: "manutenzione_ospiti",
          title: `Manutenzione: ${roomOrArea}`,
          detail: issue,
          authorRole: getCurrentRole().label
        });
        saveState();
        render();
        showInfoToast(`Intervento inviato (${state.selectedDate} ${nowTime}).`);
      },
      toggleMaintenanceStatus(ticketId) {
        const ticket = state.maintenanceTickets.find((t) => t.id === ticketId);
        if (!ticket) return;
        const order = ["Aperta", "In corso", "Completata"];
        const nextIdx = (order.indexOf(ticket.status) + 1) % order.length;
        ticket.status = order[nextIdx];
        saveState();
        render();
      },
      addComplaint(event) {
        event.preventDefault();
        const roomOrGuest = (document.getElementById("cmp-room")?.value || "").trim();
        const detail = (document.getElementById("cmp-detail")?.value || "").trim();
        if (!roomOrGuest || !detail) {
          showInfoToast("Inserisci camera/ospite e dettaglio segnalazione.");
          return;
        }
        const cmpId = `cmp_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const nowTime = getCurrentTimeHHMM();
        state.complaints.unshift({
          id: cmpId,
          date: state.selectedDate,
          time: nowTime,
          roomOrGuest,
          detail,
          status: "Aperta"
        });
        recordInDirectionArchive({
          sourceRef: `complaint:${cmpId}`,
          date: state.selectedDate,
          time: nowTime,
          category: "lamentela_clienti",
          title: `Lamentela Cliente: ${roomOrGuest}`,
          detail,
          authorRole: getCurrentRole().label
        });
        saveState();
        render();
        showInfoToast(`Segnalazione registrata (${state.selectedDate} ${nowTime}).`);
      },
      setComplaintStatus(complaintId, newStatus) {
        const cmp = state.complaints.find((c) => c.id === complaintId);
        if (!cmp) return;
        cmp.status = newStatus;
        const linkedArc = (state.archiveEntries || []).find((e) => e.sourceRef === `complaint:${complaintId}`);
        if (linkedArc) {
          linkedArc.detail = `${cmp.detail} (${newStatus})`;
        }
        saveState();
        render();
      },
      toggleArchiveFolder(categoryId) {
        if (state.archiveFilterCategory === categoryId) {
          state.archiveFilterCategory = null;
        } else {
          state.archiveFilterCategory = categoryId;
          state.archiveQuickTool = null;
        }
        render();
      },
      setArchiveSearch(query) {
        state.archiveSearchQuery = query || "";
        render();
      },
      setArchiveDateFilter(dateISO) {
        state.archiveDateFilter = dateISO || "";
        render();
      },
      resetArchiveFilters() {
        state.archiveSearchQuery = "";
        state.archiveDateFilter = "";
        render();
      },
      deleteArchiveEntry(entryId) {
        if (!canViewAllDepartments()) return;
        state.archiveEntries = state.archiveEntries.filter((e) => e.id !== entryId);
        saveState();
        render();
        showInfoToast("Voce rimossa dall'archivio.");
      }
    };

    function renderSectorPasswordsManager() {
      if (!canManageSectorCredentials()) return "";

      const allCredentialKeys = [

      const role = getCurrentRole();

        if (canViewAllDepartments()) return true;
        const targets = Array.isArray(note.targetDeptIds)
          ? note.targetDeptIds
          : note.deptId
          ? [note.deptId]
          : ["all"];
        if (targets.includes("all")) return true;
        if (role.deptId && targets.includes(role.deptId)) return true;
        if (role.deptId === "cucina" && targets.includes("plonge")) return true;

                                    <label class="px-2 py-1 rounded-xl border text-[11px] font-bold cursor-pointer flex items-center gap-1 ${

                      <textarea

                        rows="3"

              <div class="space-y-2.5">

                  visibleNotes.length === 0
                    ? `<p class="text-xs text-slate-400">Nessuna nota visibile per questo reparto.</p>`

                                  canDelete

                                ${escapeHtml(n.text)}

                            </div>

                        .join("")
                }
              </div>
            </div>
          </div>
        </section>
      `;

    function renderDirectionArchiveSection() {
      if (!canViewAllDepartments()) {
        return `
          <div class="bg-white rounded-3xl border border-slate-200 p-6 text-center text-sm font-bold text-slate-600">
            Archivio riservato esclusivamente a Direttore e Vice Direttore.
          </div>
        `;
      }

      const activeCat = state.archiveFilterCategory;
      const searchQ = (state.archiveSearchQuery || "").trim().toLowerCase();
      const dateFilter = (state.archiveDateFilter || "").trim();
      const allEntries = getSortedArchiveEntries();

      const folderStyleMap = {
        ordini_servizio: "border-sky-200 bg-gradient-to-br from-sky-50 to-white hover:border-sky-400",
        cambi_camera: "border-teal-200 bg-gradient-to-br from-teal-50 to-white hover:border-teal-400",
        pasti_intolleranze: "border-amber-200 bg-gradient-to-br from-amber-50 to-white hover:border-amber-400",
        movimento_pasti: "border-orange-200 bg-gradient-to-br from-orange-50 to-white hover:border-orange-400",
        manutenzione_ospiti: "border-violet-200 bg-gradient-to-br from-violet-50 to-white hover:border-violet-400",
        lamentela_clienti: "border-rose-200 bg-gradient-to-br from-rose-50 to-white hover:border-rose-400"
      };

      const selectedCategoryMeta = ARCHIVE_CATEGORIES.find((c) => c.id === activeCat) || null;
      const categoryItems = selectedCategoryMeta
        ? allEntries.filter((e) => {
            if (e.category !== selectedCategoryMeta.id) return false;
            if (dateFilter && e.date !== dateFilter) return false;
            if (searchQ) {
              const hay = `${e.title || ""} ${e.detail || ""} ${e.authorRole || ""}`.toLowerCase();
              if (!hay.includes(searchQ)) return false;
            }
            return true;
          })
        : [];

      return `
        <section class="space-y-4">
          <div class="bg-gradient-to-r from-indigo-950 via-slate-900 to-amber-950 text-white rounded-3xl p-4 sm:p-5 shadow-xs">
            <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-amber-400/20 text-amber-300 border border-amber-300/30 mb-1">
              Accesso Facile Direzione & Vice
            </span>
            <h2 class="text-base sm:text-lg font-black">
              Archivio Direzione
            </h2>
            <p class="text-xs text-slate-300">
              Tocca una cartella per aprirla, tocca di nuovo lo stesso riquadro per chiuderla.
            </p>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            ${ARCHIVE_CATEGORIES.map((cat) => {
              const count = allEntries.filter((e) => e.category === cat.id).length;
              const isOpen = activeCat === cat.id;
              return `
                <button
                  type="button"
                  onclick="window.__hub.toggleArchiveFolder('${cat.id}')"
                  class="press-btn p-4 rounded-3xl border-2 text-left transition cursor-pointer flex flex-col justify-between min-h-[104px] shadow-2xs ${
                    isOpen
                      ? "bg-slate-900 text-white border-amber-400 ring-2 ring-amber-300/60"
                      : `${folderStyleMap[cat.id] || "bg-white border-slate-200"} text-slate-900`
                  }"
                >
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-xl">${cat.icon}</span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-black ${
                      isOpen ? "bg-amber-400 text-slate-950" : "bg-white text-slate-800 border border-slate-200"
                    }">
                      ${count}
                    </span>
                  </div>
                  <div class="mt-2">
                    <div class="text-xs font-black leading-snug">
                      ${escapeHtml(cat.label)}
                    </div>
                    <div class="text-[10px] font-bold mt-0.5 ${isOpen ? "text-amber-300" : "text-slate-500"}">
                      ${isOpen ? "▲ Tocca per chiudere" : "▼ Tocca per aprire"}
                    </div>
                  </div>
                </button>
              `;
            }).join("")}
          </div>

          ${
            selectedCategoryMeta
              ? `<div class="bg-white rounded-3xl border-2 border-slate-900/15 p-4 sm:p-5 space-y-3.5 shadow-sm">
                  <div class="flex items-center justify-between gap-2 border-b border-slate-100 pb-3 flex-wrap">
                    <div class="flex items-center gap-2">
                      <span class="px-3 py-1 rounded-full text-xs font-black border ${selectedCategoryMeta.badgeClass}">
                        ${selectedCategoryMeta.icon} ${escapeHtml(selectedCategoryMeta.label)}
                      </span>
                      <span class="text-xs font-extrabold text-slate-500">
                        (${categoryItems.length} ${categoryItems.length === 1 ? "voce" : "voci"})
                      </span>
                    </div>
                    <button
                      type="button"
                      onclick="window.__hub.toggleArchiveFolder('${selectedCategoryMeta.id}')"
                      class="press-btn px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-extrabold cursor-pointer"
                    >
                      Chiudi Cartella ✕
                    </button>
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                    <input
                      type="text"
                      value="${escapeHtml(state.archiveSearchQuery || "")}"
                      oninput="window.__hub.setArchiveSearch(this.value)"
                      placeholder="🔍 Cerca nella cartella..."
                      class="sm:col-span-6 px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-bold text-slate-900"
                    />
                    <input
                      type="date"
                      value="${escapeHtml(state.archiveDateFilter || "")}"
                      onchange="window.__hub.setArchiveDateFilter(this.value)"
                      class="sm:col-span-4 px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-extrabold text-slate-800"
                    />
                    <button
                      type="button"
                      onclick="window.__hub.resetArchiveFilters()"
                      class="sm:col-span-2 press-btn py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-extrabold text-slate-700 cursor-pointer"
                    >
                      Reset
                    </button>
                  </div>

                  ${
                    categoryItems.length === 0
                      ? `<p class="text-xs text-slate-400 py-3 text-center">Nessuna voce presente in questa cartella.</p>`
                      : `<div class="space-y-2.5">
                          ${categoryItems
                            .map(
                              (entry) => `
                                <div class="p-3.5 rounded-2xl border border-slate-200 bg-slate-50/70 space-y-1">
                                  <div class="flex items-center justify-between gap-2 flex-wrap">
                                    <span class="text-[11px] font-extrabold text-slate-600">
                                      ${escapeHtml(formatPublishedBadge(entry.date, entry.time || "--:--"))} • 👤 ${escapeHtml(entry.authorRole || "Direzione")}
                                    </span>
                                    <button
                                      type="button"
                                      onclick="window.__hub.deleteArchiveEntry('${entry.id}')"
                                      class="press-btn px-2 py-0.5 rounded-lg text-[11px] font-bold text-rose-700 hover:bg-rose-50 cursor-pointer"
                                    >
                                      Elimina
                                    </button>
                                  </div>
                                  <div class="text-xs sm:text-sm font-black text-slate-900">
                                    ${escapeHtml(entry.title)}
                                  </div>
                                  <p class="text-xs text-slate-700 leading-relaxed">
                                    ${escapeHtml(entry.detail)}
                                  </p>
                                </div>
                              `
                            )
                            .join("")}
                        </div>`
                  }
                </div>`
              : ""
          }
        </section>
      `;
    }

    function renderActiveSection() {
      const availableSections = getAvailableSectionsForRole();
      const gridColsClass = availableSections.length <= 1 ? "grid-cols-1" : "grid-cols-1 sm:grid-cols-2";

      const sectionNames = {
        attendance: "Presenze Mensili",
        meals: "Movimenti Pasti & Packet Lunch",
        notes: "Note di Servizio",
        maintenance: "Manutenzione",
        complaints: "Segnalazioni Ospiti",
        archive: "Archivio Direzione"
      };

      const sectionBreadcrumbBar = state.activeSection
        ? `<div class="mb-4 flex items-center justify-between gap-2 bg-white/90 px-3.5 py-2.5 rounded-2xl border border-slate-200 shadow-2xs">
            <div class="text-xs font-black text-slate-800">
              Sezione: <span class="text-indigo-700">${escapeHtml(sectionNames[state.activeSection] || "")}</span>
            </div>
            <button
              type="button"
              onclick="window.__hub.goHome()"
              class="press-btn px-3 py-1 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-black cursor-pointer"
            >
              ← Torna alla Home
            </button>
          </div>`
        : "";

      let sectionContentHtml = "";

      switch (state.activeSection) {
        case "attendance":
          sectionContentHtml = renderMonthlyAttendanceSection();
          break;
        case "meals":
          sectionContentHtml = renderMealsAndPacketsSection();
          break;
        case "notes":
          sectionContentHtml = renderServiceNotesSection();
          break;
        case "maintenance":
          sectionContentHtml = renderMaintenanceSection();
          break;
        case "complaints":
          sectionContentHtml = renderComplaintsSection();
          break;
        case "archive":
          sectionContentHtml = renderDirectionArchiveSection();
          break;
        default:
          sectionContentHtml = `
            <div class="space-y-5">
              <div class="grid ${gridColsClass} gap-3.5">
                ${
                  availableSections.includes("attendance")
                    ? `<button
                        type="button"
                        onclick="window.__hub.openSection('attendance')"
                        class="press-btn text-left p-4 rounded-3xl bg-gradient-to-br from-emerald-50 to-teal-50/70 hover:from-emerald-100/80 hover:to-teal-100/70 border border-emerald-200/90 shadow-2xs flex items-center justify-between gap-3 cursor-pointer"
                      >
                        <div>
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-emerald-100 text-emerald-900 border border-emerald-200">
                            Personale
                          </span>
                          <div class="text-sm sm:text-base font-black text-slate-900 mt-1.5">
                            Presenze Mensili
                          </div>
                          <div class="text-xs text-slate-600 mt-0.5">
                            Turni, riposi, ferie e assenze
                          </div>
                        </div>
                        <span class="text-xl">📅</span>
                      </button>`
                    : ""
                }
                ${
                  availableSections.includes("meals")
                    ? `<button
                        type="button"
                        onclick="window.__hub.openSection('meals')"
                        class="press-btn text-left p-4 rounded-3xl bg-gradient-to-br from-amber-50 to-orange-50/70 hover:from-amber-100/80 hover:to-orange-100/70 border border-amber-200/90 shadow-2xs flex items-center justify-between gap-3 cursor-pointer"
                      >
                        <div>
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-amber-100 text-amber-950 border border-amber-200">
                            Ristorazione
                          </span>
                          <div class="text-sm sm:text-base font-black text-slate-900 mt-1.5">
                            Movimenti & Packet Lunch
                          </div>
                          <div class="text-xs text-slate-600 mt-0.5">
                            Pasti del giorno, packet e intolleranze
                          </div>
                        </div>
                        <span class="text-xl">🍽️</span>
                      </button>`
                    : ""
                }
                ${
                  availableSections.includes("notes")
                    ? `<button
                        type="button"
                        onclick="window.__hub.openSection('notes')"
                        class="press-btn text-left p-4 rounded-3xl bg-gradient-to-br from-sky-50 to-indigo-50/70 hover:from-sky-100/80 hover:to-indigo-100/70 border border-sky-200/90 shadow-2xs flex items-center justify-between gap-3 cursor-pointer"
                      >
                        <div>
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-sky-100 text-sky-900 border border-sky-200">
                            Comunicazioni
                          </span>
                          <div class="text-sm sm:text-base font-black text-slate-900 mt-1.5">
                            Note di Servizio
                          </div>
                          <div class="text-xs text-slate-600 mt-0.5">
                            Ordini per reparti e cambi camera
                          </div>
                        </div>
                        <span class="text-xl">📝</span>
                      </button>`
                    : ""
                }
                ${
                  availableSections.includes("maintenance")
                    ? `<button
                        type="button"
                        onclick="window.__hub.openSection('maintenance')"
                        class="press-btn text-left p-4 rounded-3xl bg-gradient-to-br from-violet-50 to-purple-50/70 hover:from-violet-100/80 hover:to-purple-100/70 border border-violet-200/90 shadow-2xs flex items-center justify-between gap-3 cursor-pointer"
                      >
                        <div>
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-violet-100 text-violet-900 border border-violet-200">
                            Tecnica
                          </span>
                          <div class="text-sm sm:text-base font-black text-slate-900 mt-1.5">
                            Manutenzione
                          </div>
                          <div class="text-xs text-slate-600 mt-0.5">
                            ${state.maintenanceTickets.length} interventi registrati
                          </div>
                        </div>
                        <span class="text-xl">🛠️</span>
                      </button>`
                    : ""
                }
                ${
                  availableSections.includes("complaints")
                    ? `<button
                        type="button"
                        onclick="window.__hub.openSection('complaints')"
                        class="press-btn text-left p-4 rounded-3xl bg-gradient-to-br from-rose-50 to-pink-50/70 hover:from-rose-100/80 hover:to-pink-100/70 border border-rose-200/90 shadow-2xs flex items-center justify-between gap-3 cursor-pointer"
                      >
                        <div>
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-rose-100 text-rose-900 border border-rose-200">
                            Ospiti
                          </span>
                          <div class="text-sm sm:text-base font-black text-slate-900 mt-1.5">
                            Segnalazioni Ospiti
                          </div>
                          <div class="text-xs text-slate-600 mt-0.5">
                            ${state.complaints.length} segnalazioni attive
                          </div>
                        </div>
                        <span class="text-xl">🛎️</span>
                      </button>`
                    : ""
                }
                ${
                  availableSections.includes("archive")
                    ? `<button
                        type="button"
                        onclick="window.__hub.openSection('archive')"
                        class="press-btn text-left p-4 rounded-3xl bg-gradient-to-br from-indigo-50 to-amber-50/70 hover:from-indigo-100/80 hover:to-amber-100/70 border border-indigo-200/90 shadow-2xs flex items-center justify-between gap-3 cursor-pointer"
                      >
                        <div>
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-indigo-100 text-indigo-900 border border-indigo-200">
                            Direzione & Vice
                          </span>
                          <div class="text-sm sm:text-base font-black text-slate-900 mt-1.5">
                            Archivio Direzione
                          </div>
                          <div class="text-xs text-slate-600 mt-0.5">
                            ${(state.archiveEntries || []).length} voci categorizzate
                          </div>
                        </div>
                        <span class="text-xl">🗂️</span>
                      </button>`
                    : ""
                }
              </div>

              ${renderSectorPasswordPrompt()}
              ${renderDirectionStaffManagerBox()}
              ${renderSectorPasswordsManager()}
            </div>
          `;
          break;
      }

      return `${sectionBreadcrumbBar}${sectionContentHtml}`;
    }

    function renderInitialLoginScreen() {
      const quickRoles = [
        { key: "director", label: "Direttore", pillClass: "bg-amber-100 text-amber-950 border-amber-300" },
        { key: "vice_director", label: "Vice Dir.", pillClass: "bg-orange-100 text-orange-950 border-orange-300" },
        ...DEPARTMENTS.filter((d) => d.id !== "direzione").map((d) => ({
          key: d.id,
          label: d.name,
          pillClass: d.badgeClass
        }))
      ];

      return `
        <div class="min-h-screen flex items-center justify-center px-4 py-8 bg-gradient-to-br from-amber-100/80 via-rose-50/70 to-sky-100/80">
          <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl border border-white shadow-xl p-5 sm:p-6 space-y-5">
            <div class="text-center space-y-1.5">
              <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-indigo-600 via-purple-600 to-amber-500 text-white font-black text-lg flex items-center justify-center shadow-md">
                GH
              </div>
              <span class="inline-block px-3 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-indigo-100 text-indigo-900">
                Portale Capi Reparto & Direzione
              </span>
              <h1 class="text-xl font-black text-slate-900">
                Accedi al Tuo Settore
              </h1>
              <p class="text-xs text-slate-500">
                Inserisci username e password assegnati da Direttore o Vice Direttore.
              </p>
            </div>

            <form onsubmit="window.__hub.submitInitialLogin(event)" class="space-y-3.5">
              <label class="space-y-1 block">
                <span class="text-xs font-extrabold text-slate-700 block">Username</span>
                <input
                  id="login-username-input"
                  type="text"
                  autocomplete="username"
                  value="${escapeHtml(state.loginUsernameDraft || "")}"
                  oninput="window.__hub.updateLoginUsername(this.value)"
                  placeholder="Es. direttore, vicedirettore, cucina, sala..."
                  class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50 focus:bg-white text-sm font-extrabold text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-400"
                />
              </label>

              <label class="space-y-1 block">
                <span class="text-xs font-extrabold text-slate-700 block">Password</span>
                <input
                  id="login-password-input"
                  type="password"
                  autocomplete="current-password"
                  value="${escapeHtml(state.loginPasswordDraft || "")}"
                  oninput="window.__hub.updateLoginPassword(this.value)"
                  placeholder="Inserisci password..."
                  class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50 focus:bg-white text-sm font-extrabold text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-400"
                />
              </label>

              ${
                state.loginError
                  ? `<div class="p-3 rounded-2xl bg-rose-50 border border-rose-200 text-xs font-extrabold text-rose-700">
                      ${escapeHtml(state.loginError)}
                    </div>`
                  : ""
              }

              <button
                type="submit"
                class="press-btn w-full py-3 px-4 rounded-2xl bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-700 hover:via-purple-700 hover:to-pink-700 text-white text-sm font-black cursor-pointer shadow-md"
              >
                Entra nell'App
              </button>
            </form>

            <div class="pt-3 border-t border-slate-100 space-y-2">
              <div class="text-[11px] font-extrabold text-slate-500 text-center">
                Tocca un settore per compilare subito l'username:
              </div>
              <div class="flex flex-wrap justify-center gap-1.5">
                ${quickRoles
                  .map((qr) => {
                    const hasPass = Boolean(getSectorPassword(qr.key));
                    return `
                      <button
                        type="button"
                        onclick="window.__hub.quickFillLogin('${qr.key}')"
                        class="press-btn px-2.5 py-1 rounded-full text-[11px] font-extrabold border cursor-pointer flex items-center gap-1 ${qr.pillClass}"
                      >
                        <span>${escapeHtml(qr.label)}</span>
                        ${hasPass ? `<span class="text-[9px]">🔒</span>` : ""}
                      </button>
                    `;
                  })
                  .join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      try {
        const root = document.getElementById("app");
        if (!root) return;
        if (!state.isAuthenticated) {
          root.innerHTML = renderInitialLoginScreen();
          return;
        }
        syncActiveSectionWithRole();
        root.innerHTML = `
          ${renderTopBar()}
          <main class="flex-1 max-w-3xl w-full mx-auto px-3.5 py-4 pb-10">
            ${renderActiveSection()}
          </main>
        `;
      } catch (err) {
        console.error("Errore durante il rendering:", err);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      render();
    });
  </script>
</body>
</html>

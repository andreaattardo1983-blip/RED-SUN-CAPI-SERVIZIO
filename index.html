    function getTodayIso() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function getCurrentMonthYm() {
      return getTodayIso().slice(0, 7);
    }

    function nowTimestamp() {
      return new Date().toLocaleString("it-IT", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getDaysInMonth(ym) {
      const [yStr, mStr] = (ym || getCurrentMonthYm()).split("-");
      const year = Number(yStr) || 2026;
      const month = Number(mStr) || 11;
      const count = new Date(year, month, 0).getDate();
      return Array.from({ length: count }, (_, idx) => {
        const day = idx + 1;
        return `${yStr}-${mStr}-${String(day).padStart(2, "0")}`;
      });
    }

            if (dayMap[p.id]) {
              next[p.id] = {
                status: dayMap[p.id].status || "Presente",
                reason: dayMap[p.id].reason || ""
              };
            } else if (!next[p.id]) {
              next[p.id] = { status: "Presente", reason: "" };
            }
          });
          return next;
        });
      }, [data.staff, selectedDate, data.attendanceLogByDate]);

      useEffect(() => {
        let manifestUrl = "";
        try {
          const manifestObj = {
            name: "Hotel Capi Servizio Hub",
            short_name: "Capi Servizio",
            start_url: ".",
            display: "standalone",
            background_color: "#f1f5f9",
            theme_color: "#0f172a"
          };
          const blob = new Blob([JSON.stringify(manifestObj)], {
            type: "application/json"
          });
          manifestUrl = URL.createObjectURL(blob);
          const link = document.createElement("link");
          link.rel = "manifest";
          link.href = manifestUrl;
          document.head.appendChild(link);
        } catch (e) {}

        const onBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener("beforeinstallprompt", onBeforeInstall);

        return () => {
          window.removeEventListener("beforeinstallprompt", onBeforeInstall);
          if (manifestUrl) URL.revokeObjectURL(manifestUrl);
        };
      }, []);

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast((prev) => (prev === msg ? "" : prev)), 3200);

          id: `his-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,

          department,
          summary,
          detail: detail || "",

          ...prev,
          history: [entry, ...prev.history]

        colazione: 0,
        pranzo: 0,
        cena: 0

      const updateMealValue = (field, rawVal) => {
        const num = Math.max(0, parseInt(rawVal || "0", 10) || 0);

          ...prev,
          mealsByDate: {

              pranzo: prev.mealsByDate?.[selectedDate]?.pranzo ?? 0,
              cena: prev.mealsByDate?.[selectedDate]?.cena ?? 0,
              [field]: num
            }
          }
        }));
      };

          type: "Coperti Ospiti",
          department: "Ricevimento",

      const setDraftStatus = (personId, newStatus) => {
        setAttendanceDraft((prev) => ({
          ...prev,

            status: newStatus,
            reason: ABSENCE_STATUSES.has(newStatus) ? prev[personId]?.reason || "" : ""

        setAttendanceDraft((prev) => ({
          ...prev,
          [personId]: {
            status: prev[personId]?.status || "Presente",
            reason: reasonText
          }

      };

      const saveAttendanceForGroup = (groupStaff, deptLabel) => {
        for (const person of groupStaff) {
          const entry = attendanceDraft[person.id] || { status: "Presente", reason: "" };
          if (ABSENCE_STATUSES.has(entry.status) && !entry.reason.trim()) {
            notify(`Inserisci il motivo per ${person.name} (${entry.status}).`);
            return;
          }
        }

        const updatedDayMap = { ...(data.attendanceLogByDate?.[selectedDate] || {}) };
        const summaryLines = [];

        groupStaff.forEach((person) => {
          const entry = attendanceDraft[person.id] || { status: "Presente", reason: "" };
          const cleanReason = ABSENCE_STATUSES.has(entry.status) ? entry.reason.trim() : "";
          updatedDayMap[person.id] = {
            status: entry.status,
            reason: cleanReason
          };
          summaryLines.push(
            `${person.name}: ${entry.status}${cleanReason ? ` (${cleanReason})` : ""}`
          );
        });

        setData((prev) => ({
          ...prev,
          attendanceLogByDate: {
            ...(prev.attendanceLogByDate || {}),
            [selectedDate]: updatedDayMap
          }
        }));

        pushHistory({
          type: "Presenze",
          department: deptLabel,
          summary: `Presenze ${deptLabel} (${selectedDate}): ${groupStaff.length} operatori`,
          detail: summaryLines.join(" • ")
        });

        notify(`Presenze di ${deptLabel} (${selectedDate}) salvate nello storico.`);
      };

      const submitDirectorNote = (e) => {
        e.preventDefault();
        if (!noteForm.title.trim() || !noteForm.message.trim()) {
          notify("Inserisci Titolo e Messaggio della nota.");
          return;

          title: noteForm.title.trim(),
          message: noteForm.message.trim(),
          target: noteForm.target,
          importance: noteForm.importance,

          title: "",
          message: "",
          target: "Tutti",
          importance: "Media",

        notify("Nota inviata e firmata.");

          notify("Scrivi una comunicazione prima di inviare.");
          return;

        const signer = commForm.signedBy.trim() || actorLabel;

          id: `comm-${Date.now()}`,
          department: deptName,
          message: commForm.message.trim(),
          signedBy: signer,
          createdAt: nowTimestamp()

        setData((prev) => ({
          ...prev,
          deptCommunications: [comm, ...prev.deptCommunications]

          type: "Comunicazioni",
          department: deptName,
          summary: `Comunicazione ${deptName} (Firma: ${signer})`,
          detail: comm.message

        setCommForm({ message: "", signedBy: "" });
        notify(`Comunicazione inviata e firmata da ${signer}.`);
      };

        signedBy,
        assignedTechnician

          notify("Compila Camera/Area e Descrizione dell'intervento.");

        const signer = (signedBy || "").trim() || fromRole;
        const tech =
          (assignedTechnician || "").trim() ||
          techniciansList[0]?.name ||

        const ticket = {
          id: `mnt-${Date.now()}`,
          area: area.trim(),
          description: description.trim(),
          priority: priority || "Media",
          fromRole,
          signedBy: signer,
          assignedTechnician: tech,
          status: "Aperta",
          createdAt: nowTimestamp()

        setData((prev) => ({
          ...prev,
          maintenances: [ticket, ...prev.maintenances]
        }));
        pushHistory({
          type: "Manutenzioni",
          department: "Manutenzione",
          summary: `[${ticket.priority}] ${ticket.area}: ${ticket.description} (Firma: ${signer} • Tecnico: ${tech})`,
          detail: `Inviato da ${fromRole} • Stato: Aperta`
        });
        return true;
      };

      const submitMaintenanceFromReception = (e) => {
        e.preventDefault();
        const ok = createMaintenanceTicket({
          area: maintForm.area,
          description: maintForm.description,
          priority: maintForm.priority,
          fromRole: actorLabel,
          signedBy: maintForm.signedBy,
          assignedTechnician: maintForm.assignedTechnician
        });
        if (ok) {
          setMaintForm({
            area: "",
            description: "",
            priority: "Media",
            signedBy: "",
            assignedTechnician: techniciansList[0]?.name || "Paolo Mancini"
          });
          notify("Intervento di manutenzione inviato e firmato.");
        }
      };

      const toggleMaintenanceStatus = (ticketId) => {
        let updatedTitle = "";
        setData((prev) => ({
          ...prev,
          maintenances: prev.maintenances.map((m) => {
            if (m.id !== ticketId) return m;
            const nextStatus = m.status === "Aperta" ? "Completata" : "Aperta";
            updatedTitle = `${m.area} (${m.description}) → ${nextStatus} [Tecnico: ${m.assignedTechnician || "N/D"}]`;
            return { ...m, status: nextStatus };
          })
        }));
        if (updatedTitle) {
          pushHistory({
            type: "Manutenzioni",
            department: "Manutenzione",
            summary: `Aggiornamento stato: ${updatedTitle}`,
            detail: `Aggiornato da ${actorLabel}`
          });
          notify("Stato manutenzione aggiornato.");
        }
      };

      const updateMaintenanceTechnician = (ticketId, techName) => {
        let info = null;
        setData((prev) => ({
          ...prev,
          maintenances: prev.maintenances.map((m) => {
            if (m.id !== ticketId) return m;
            info = { area: m.area, description: m.description, techName };
            return { ...m, assignedTechnician: techName };
          })
        }));
        if (info) {
          pushHistory({
            type: "Manutenzioni",
            department: "Manutenzione",
            summary: `Tecnico assegnato per ${info.area}: ${techName || "Non assegnato"}`,
            detail: `${info.description} • Aggiornato da ${actorLabel}`
          });
          notify(`Esecutore aggiornato: ${techName || "Non assegnato"}.`);
        }
      };

      const submitReadyRoomAlert = (e) => {
        e.preventDefault();
        if (!readyRoomForm.room.trim()) {
          notify("Inserisci il numero o nome della camera pronta.");
          return;
        }
        const signer = readyRoomForm.signedBy.trim() || "Elena Rinaldi";
        const alertItem = {
          id: `rm-${Date.now()}`,
          room: readyRoomForm.room.trim(),
          notes: readyRoomForm.notes.trim() || "Camera pronta e riordinata",
          signedBy: signer,
          createdAt: nowTimestamp(),
          acknowledgedBy: []
        };
        setData((prev) => ({
          ...prev,
          readyRoomsAlerts: [alertItem, ...prev.readyRoomsAlerts]
        }));
        pushHistory({
          type: "Camere Pronte",
          department: "Lavanderia",
          summary: `${alertItem.room} pronta → Avviso a Ricevimento, Direttore e Vice Direttore (Firma: ${signer})`,
          detail: alertItem.notes
        });
        setReadyRoomForm({ room: "", notes: "", signedBy: "" });
        notify(`Avviso inviato per ${alertItem.room} a Ricevimento, Direttore e Vice Direttore.`);
      };

      const acknowledgeReadyRoom = (alertId, receiverName) => {
        setData((prev) => ({
          ...prev,
          readyRoomsAlerts: prev.readyRoomsAlerts.map((item) => {
            if (item.id !== alertId) return item;
            const current = item.acknowledgedBy || [];
            if (current.includes(receiverName)) return item;
            return { ...item, acknowledgedBy: [...current, receiverName] };
          })
        }));
        notify(`Confermata ricezione avviso camera da ${receiverName}.`);
      };

      const submitGuestComplaint = (e) => {
        e.preventDefault();
        if (!complaintForm.guestName.trim() || !complaintForm.description.trim()) {
          notify("Inserisci nome cliente e dettaglio della lamentela.");
          return;
        }
        const signer = complaintForm.signedBy.trim() || "Giulia Conti";
        const complaint = {
          id: `cmp-${Date.now()}`,
          guestName: complaintForm.guestName.trim(),
          room: complaintForm.room.trim() || "N/D",
          category: complaintForm.category,
          description: complaintForm.description.trim(),
          severity: complaintForm.severity,
          signedBy: signer,
          status: "Aperta",
          createdAt: nowTimestamp()
        };
        setData((prev) => ({
          ...prev,
          guestComplaints: [complaint, ...prev.guestComplaints]
        }));
        pushHistory({
          type: "Lamentele Clienti",
          department: "Ricevimento",
          summary: `[${complaint.severity}] Lamentela ${complaint.guestName} (${complaint.room}) → Direttore & Vice (Firma: ${signer})`,
          detail: `${complaint.category}: ${complaint.description}`
        });
        setComplaintForm({
          guestName: "",
          room: "",
          category: "Camera / Pulizia",
          description: "",
          severity: "Media",
          signedBy: ""
        });
        notify("Lamentela cliente registrata e inviata a Direttore e Vice Direttore.");
      };

      const toggleComplaintStatus = (complaintId) => {
        let nextStatus = "Gestita";
        let guestLabel = "";
        setData((prev) => ({
          ...prev,
          guestComplaints: prev.guestComplaints.map((c) => {
            if (c.id !== complaintId) return c;
            nextStatus = c.status === "Aperta" ? "Gestita" : "Aperta";
            guestLabel = `${c.guestName} (${c.room})`;
            return { ...c, status: nextStatus };
          })
        }));
        if (guestLabel) {
          pushHistory({
            type: "Lamentele Clienti",
            department: "Direzione",
            summary: `Lamentela ${guestLabel} → ${nextStatus}`,
            detail: `Aggiornato da ${actorLabel}`
          });
          notify(`Stato lamentela aggiornato a "${nextStatus}".`);
        }
      };

      const addStaffMember = (e) => {
        e.preventDefault();
        if (!staffForm.name.trim() || !staffForm.role.trim() || !staffForm.contractStart) {
          notify("Compila Nome, Ruolo e Data inizio contratto.");
          return;
        }
        const member = {
          id: `st-${Date.now()}`,
          name: staffForm.name.trim(),
          role: staffForm.role.trim(),
          department: staffForm.department,
          contractStart: staffForm.contractStart,
          contractEnd: staffForm.contractEnd || "Indeterminato"
        };
        setData((prev) => ({
          ...prev,
          staff: [...prev.staff, member]
        }));
        pushHistory({
          type: "Personale & Contratti",
          department: member.department,
          summary: `Nuovo dipendente: ${member.name} (${member.role} - ${member.department})`,
          detail: `Contratto dal ${member.contractStart} al ${member.contractEnd}`
        });
        setStaffForm({
          name: "",
          role: "",
          department: "Ricevimento",
          contractStart: getTodayIso(),
          contractEnd: ""
        });
        notify(`Dipendente "${member.name}" aggiunto con contratto.`);
      };

      const removeStaffMember = (id) => {
        const target = data.staff.find((s) => s.id === id);
        setData((prev) => ({
          ...prev,
          staff: prev.staff.filter((s) => s.id !== id)
        }));
        if (target) {
          pushHistory({
            type: "Personale & Contratti",
            department: target.department,
            summary: `Rimosso dipendente: ${target.name} (${target.role})`,
            detail: `Reparto ${target.department}`
          });
          notify(`Rimosso "${target.name}".`);
        }
      };

      const staffByDept = useMemo(() => {
        const map = {
          ricevimento: [],
          lavanderia: [],
          sala: [],
          cucina: [],
          plonge: [],
          manutenzione: []
        };
        data.staff.forEach((s) => {
          if (s.department === "Ricevimento") map.ricevimento.push(s);
          else if (s.department === "Lavanderia") map.lavanderia.push(s);
          else if (s.department === "Sala") map.sala.push(s);
          else if (s.department === "Cucina") map.cucina.push(s);
          else if (s.department === "Plonge") map.plonge.push(s);
          else if (s.department === "Manutenzione") map.manutenzione.push(s);
        });
        return map;
      }, [data.staff]);

      const openComplaintsCount = data.guestComplaints.filter((c) => c.status === "Aperta").length;

      // Righe presenze filtrate per Report Completo e PDF
      const filteredAttendanceRows = useMemo(() => {
        const rows = [];
        const logByDate = data.attendanceLogByDate || {};

        Object.entries(logByDate)
          .sort(([a], [b]) => b.localeCompare(a))
          .forEach(([dateStr, dayMap]) => {
            if (reportFilters.dateFrom && dateStr < reportFilters.dateFrom) return;
            if (reportFilters.dateTo && dateStr > reportFilters.dateTo) return;
            if (
              !reportFilters.dateFrom &&
              !reportFilters.dateTo &&
              reportFilters.month &&
              !dateStr.startsWith(reportFilters.month)
            ) {
              return;
            }

            Object.entries(dayMap || {}).forEach(([personId, rec]) => {
              const person = data.staff.find((s) => s.id === personId);
              if (!person) return;
              if (
                reportFilters.department !== "Tutti" &&
                person.department !== reportFilters.department
              ) {
                return;
              }
              const status = rec?.status || "Presente";
              if (
                reportFilters.attendanceStatus !== "Tutti" &&
                status !== reportFilters.attendanceStatus
              ) {
                return;
              }
              const reason = rec?.reason || "—";
              const hay = `${dateStr} ${person.name} ${person.role} ${person.department} ${status} ${reason}`.toLowerCase();
              if (
                reportFilters.searchText.trim() &&
                !hay.includes(reportFilters.searchText.trim().toLowerCase())
              ) {
                return;
              }

              rows.push({
                id: `${dateStr}-${person.id}`,
                date: dateStr,
                name: person.name,
                role: person.role,
                department: person.department,
                status,
                reason
              });
            });
          });

        return rows;
      }, [data.attendanceLogByDate, data.staff, reportFilters]);

      // Righe manutenzioni filtrate per Report Completo e PDF
      const filteredMaintenanceRows = useMemo(() => {
        return (data.maintenances || []).filter((m) => {
          if (
            reportFilters.maintenanceStatus !== "Tutti" &&
            m.status !== reportFilters.maintenanceStatus
          ) {
            return false;
          }
          if (
            reportFilters.maintenancePriority !== "Tutti" &&
            m.priority !== reportFilters.maintenancePriority
          ) {
            return false;
          }
          if (reportFilters.department !== "Tutti") {
            const deptMatch =
              (m.fromRole || "").toLowerCase().includes(reportFilters.department.toLowerCase()) ||
              (m.assignedTechnician || "").toLowerCase().includes(reportFilters.department.toLowerCase()) ||
              reportFilters.department === "Manutenzione";
            if (!deptMatch) return false;
          }
          const hay = `${m.area} ${m.description} ${m.priority} ${m.status} ${m.fromRole} ${m.signedBy || ""} ${m.assignedTechnician || ""} ${m.createdAt || ""}`.toLowerCase();
          if (
            reportFilters.searchText.trim() &&
            !hay.includes(reportFilters.searchText.trim().toLowerCase())
          ) {
            return false;
          }
          return true;
        });
      }, [data.maintenances, reportFilters]);

      // Storico generale filtrato
      const filteredHistoryRows = useMemo(() => {
        const activeCat =
          reportFilters.historyCategory !== "Tutti"
            ? reportFilters.historyCategory
            : historyFilter;

        return (data.history || []).filter((h) => {
          if (activeCat !== "Tutti" && h.type !== activeCat) return false;
          if (
            reportFilters.department !== "Tutti" &&
            !(h.department || "").toLowerCase().includes(reportFilters.department.toLowerCase())
          ) {
            return false;
          }
          const hay = `${h.type} ${h.department} ${h.summary} ${h.detail || ""} ${h.createdAt || ""}`.toLowerCase();
          if (
            reportFilters.searchText.trim() &&
            !hay.includes(reportFilters.searchText.trim().toLowerCase())
          ) {
            return false;
          }
          return true;
        });
      }, [data.history, historyFilter, reportFilters]);

      const resetReportFilters = () => {
        setReportFilters({
          dateFrom: "",
          dateTo: "",
          month: getCurrentMonthYm(),
          department: "Tutti",
          attendanceStatus: "Tutti",
          maintenanceStatus: "Tutti",
          maintenancePriority: "Tutti",
          historyCategory: "Tutti",
          searchText: ""
        });
        setHistoryFilter("Tutti");
        notify("Filtri del Report Completo reimpostati.");
      };

      const downloadPdfExport = (mode = "COMPLETO") => {
        try {
          const jsPdfLib = window.jspdf?.jsPDF;
          if (!jsPdfLib) {
            window.print();
            return;
          }

          const doc = new jsPdfLib({ orientation: "landscape", unit: "pt", format: "a4" });
          const titleMap = {
            PRESENZE: "Storico Presenze Personale — Hotel Capi Servizio Hub",
            MANUTENZIONI: "Storico Manutenzioni & Interventi — Hotel Capi Servizio Hub",
            COMPLETO: "Report Completo Presenze, Manutenzioni & Storico — Hotel Capi Servizio Hub"
          };

          doc.setFontSize(15);
          doc.setTextColor(15, 23, 42);
          doc.text(titleMap[mode] || titleMap.COMPLETO, 36, 38);

          doc.setFontSize(9);
          doc.setTextColor(71, 85, 105);
          const filterSummary = `Generato il: ${nowTimestamp()} • Reparto: ${reportFilters.department} • Mese: ${reportFilters.month || "Tutti"}${
            reportFilters.dateFrom ? ` • Dal: ${reportFilters.dateFrom}` : ""
          }${reportFilters.dateTo ? ` • Al: ${reportFilters.dateTo}` : ""}${
            reportFilters.searchText ? ` • Ricerca: "${reportFilters.searchText}"` : ""
          }`;
          doc.text(filterSummary, 36, 55);

          let cursorY = 72;

          if (mode === "PRESENZE" || mode === "COMPLETO") {
            doc.setFontSize(11);
            doc.setTextColor(15, 23, 42);
            doc.text(`1. Storico Presenze (${filteredAttendanceRows.length} record)`, 36, cursorY);

            doc.autoTable({
              startY: cursorY + 8,
              head: [["Data", "Dipendente", "Ruolo", "Reparto", "Stato", "Motivo Assenza"]],
              body:
                filteredAttendanceRows.length > 0
                  ? filteredAttendanceRows.map((r) => [
                      r.date,
                      r.name,
                      r.role,
                      r.department,
                      r.status,
                      r.reason
                    ])
                  : [["—", "Nessun record per i filtri selezionati", "—", "—", "—", "—"]],
              styles: { fontSize: 8, cellPadding: 4 },
              headStyles: { fillColor: [15, 23, 42], textColor: 255 },
              margin: { left: 36, right: 36 }
            });

            cursorY = (doc.lastAutoTable?.finalY || cursorY + 40) + 22;
          }

          if (mode === "MANUTENZIONI" || mode === "COMPLETO") {
            if (cursorY > 470) {
              doc.addPage();
              cursorY = 42;
            }
            doc.setFontSize(11);
            doc.setTextColor(15, 23, 42);
            doc.text(`2. Storico Manutenzioni (${filteredMaintenanceRows.length} interventi)`, 36, cursorY);

            doc.autoTable({
              startY: cursorY + 8,
              head: [["Area / Camera", "Descrizione", "Priorità", "Stato", "Firma", "Tecnico", "Data/Ora"]],
              body:
                filteredMaintenanceRows.length > 0
                  ? filteredMaintenanceRows.map((m) => [
                      m.area,
                      m.description,
                      m.priority,
                      m.status,
                      m.signedBy || m.fromRole || "—",
                      m.assignedTechnician || "—",
                      m.createdAt || "—"
                    ])
                  : [["—", "Nessuna manutenzione per i filtri selezionati", "—", "—", "—", "—", "—"]],
              styles: { fontSize: 8, cellPadding: 4 },
              headStyles: { fillColor: [180, 83, 9], textColor: 255 },
              margin: { left: 36, right: 36 }
            });

            cursorY = (doc.lastAutoTable?.finalY || cursorY + 40) + 22;
          }

          if (mode === "COMPLETO") {
            if (cursorY > 470) {
              doc.addPage();
              cursorY = 42;
            }
            doc.setFontSize(11);
            doc.setTextColor(15, 23, 42);
            doc.text(`3. Storico Attività (${filteredHistoryRows.length} eventi)`, 36, cursorY);

            doc.autoTable({
              startY: cursorY + 8,
              head: [["Categoria", "Reparto", "Riepilogo", "Dettaglio", "Data/Ora"]],
              body:
                filteredHistoryRows.length > 0
                  ? filteredHistoryRows.map((h) => [
                      h.type,
                      h.department,
                      h.summary,
                      h.detail || "—",
                      h.createdAt || "—"
                    ])
                  : [["—", "—", "Nessun evento per i filtri selezionati", "—", "—"]],
              styles: { fontSize: 8, cellPadding: 4 },
              headStyles: { fillColor: [4, 120, 87], textColor: 255 },
              margin: { left: 36, right: 36 }
            });
          }

          const fileSlug =
            mode === "PRESENZE"
              ? "Storico_Presenze"
              : mode === "MANUTENZIONI"
              ? "Storico_Manutenzioni"
              : "Report_Completo_Hotel";

          doc.save(`${fileSlug}_${selectedDate}.pdf`);
          notify(`PDF "${fileSlug}_${selectedDate}.pdf" scaricato.`);
        } catch (err) {
          window.print();
        }
      };

      const renderAttendanceBlock = (title, subtitle, groupStaff, deptLabel) => {
        const normalizedPresenceQuery = presenceNameSearch.trim().toLowerCase();
        const normalizedRestQuery = restNameSearch.trim().toLowerCase();

        const filteredGroupStaff = groupStaff.filter((person) => {
          if (!normalizedPresenceQuery) return true;
          const matchesName = (person.name || "").toLowerCase().includes(normalizedPresenceQuery);
          const matchesRole = (person.role || "").toLowerCase().includes(normalizedPresenceQuery);
          return matchesName || matchesRole;
        });

        const restingStaffMatches = groupStaff.filter((person) => {
          const draft = attendanceDraft[person.id] || { status: "Presente", reason: "" };
          if (draft.status !== "Riposo") return false;
          if (!normalizedRestQuery) return true;
          const matchesName = (person.name || "").toLowerCase().includes(normalizedRestQuery);
          const matchesReason = (draft.reason || "").toLowerCase().includes(normalizedRestQuery);
          return matchesName || matchesReason;
        });

        return (
          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h3 className="text-base font-bold text-slate-900">{title}</h3>
                <p className="text-xs text-slate-500">{subtitle}</p>
              </div>
              <button
                type="button"
                onClick={() => saveAttendanceForGroup(groupStaff, deptLabel)}
                className="bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs px-4 py-2 rounded-xl cursor-pointer"
              >
                Salva Presenze ({selectedDate})
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 rounded-2xl bg-slate-50 border border-slate-200 p-3.5">
              <div>
                <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">
                  Ricerca presenza per nome
                </label>
                <div className="relative flex items-center">
                  <input
                    type="text"
                    value={presenceNameSearch}
                    onChange={(e) => setPresenceNameSearch(e.target.value)}
                    placeholder="Cerca dipendente per nome o ruolo..."
                    className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs sm:text-sm pr-8"
                  />
                  {presenceNameSearch && (
                    <button
                      type="button"
                      onClick={() => setPresenceNameSearch("")}
                      title="Pulisci ricerca presenze"
                      className="absolute right-2.5 text-xs font-bold text-slate-400 hover:text-slate-700 cursor-pointer"
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>

              <div>
                <label className="block text-[11px] font-bold uppercase tracking-wider text-indigo-800 mb-1">
                  Ricerca riposo per nominativo
                </label>
                <div className="relative flex items-center">
                  <input
                    type="text"
                    value={restNameSearch}
                    onChange={(e) => setRestNameSearch(e.target.value)}
                    placeholder="Cerca nominativo a riposo..."
                    className="w-full bg-white border border-indigo-200 rounded-xl px-3 py-2 text-xs sm:text-sm pr-8"
                  />
                  {restNameSearch && (
                    <button
                      type="button"
                      onClick={() => setRestNameSearch("")}
                      title="Pulisci ricerca riposi"
                      className="absolute right-2.5 text-xs font-bold text-slate-400 hover:text-slate-700 cursor-pointer"
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>
            </div>

            {(restNameSearch.trim().length > 0 || restingStaffMatches.length > 0) && (
              <div className="rounded-2xl bg-indigo-50/80 border border-indigo-200 p-3.5 space-y-2">
                <div className="flex items-center justify-between gap-2">
                  <span className="text-xs font-extrabold text-indigo-950">
                    Riposi trovati ({restingStaffMatches.length})
                  </span>
                  <span className="text-[11px] font-semibold text-indigo-700">
                    Data: {selectedDate}
                  </span>
                </div>
                {restingStaffMatches.length === 0 ? (
                  <p className="text-xs text-indigo-800/80 italic">
                    Nessun nominativo a riposo corrisponde a &ldquo;{restNameSearch.trim()}&rdquo;.
                  </p>
                ) : (
                  <div className="flex flex-wrap gap-2">
                    {restingStaffMatches.map((person) => {
                      const draft = attendanceDraft[person.id] || { status: "Riposo", reason: "" };
                      return (
                        <div
                          key={person.id}
                          className="bg-white border border-indigo-200 rounded-xl px-3 py-1.5 text-xs flex items-center gap-2"
                        >
                          <span className="font-bold text-slate-900">{person.name}</span>
                          <span className="text-slate-500">({person.department})</span>
                          <span className="px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-900 font-bold text-[10px]">
                            Riposo
                          </span>
                          {draft.reason && (
                            <span className="text-slate-600">• {draft.reason}</span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {filteredGroupStaff.length === 0 ? (
              <p className="text-sm text-slate-400 italic py-3">
                {groupStaff.length === 0
                  ? `Nessun dipendente assegnato a ${deptLabel}. Aggiungilo in "Personale & Contratti".`
                  : `Nessun dipendente trovato per "${presenceNameSearch.trim()}".`}
              </p>
            ) : (
              <div className="divide-y divide-slate-100">
                {filteredGroupStaff.map((person) => {
                  const draft = attendanceDraft[person.id] || { status: "Presente", reason: "" };
                  const needsReason = ABSENCE_STATUSES.has(draft.status);
                  return (
                    <div
                      key={person.id}
                      className="py-3 flex flex-col lg:flex-row lg:items-center justify-between gap-3"
                    >
                      <div>
                        <p className="text-sm font-bold text-slate-900">{person.name}</p>
                        <p className="text-xs text-slate-500">
                          {person.role} • Contratto: {person.contractStart} → {person.contractEnd}
                        </p>
                      </div>

                      <div className="flex flex-col sm:flex-row sm:items-center gap-2">
                        <select
                          value={draft.status}
                          onChange={(e) => setDraftStatus(person.id, e.target.value)}

                  staffByDept.ricevimento,
                  "Ricevimento"
                )}
              </div>
            ) : activeSquareId === "lavanderia" ? (
              <div className="space-y-6">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                  <form
                    onSubmit={submitReadyRoomAlert}
                    className="lg:col-span-5 bg-white rounded-3xl border border-slate-200 shadow-sm p-5 space-y-3.5"

                    <div>
                      <h2 className="text-lg font-bold text-slate-900">
                        Segnala Camera Pronta
                      </h2>
                      <p className="text-xs text-slate-500">
                        Invia avviso immediato a Ricevimento, Direttore e Vice Direttore
                      </p>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Camera</label>
                      <input
                        type="text"
                        value={readyRoomForm.room}
                        onChange={(e) =>
                          setReadyRoomForm((p) => ({ ...p, room: e.target.value }))
                        }
                        placeholder="Es. Camera 205"
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                      />
                    </div>

                    {renderStaffSignatureSelect(
                      readyRoomForm.signedBy,
                      (val) => setReadyRoomForm((p) => ({ ...p, signedBy: val })),
                      "Firma operatore Lavanderia"
                    )}

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Note camera</label>
                      <input
                        type="text"
                        value={readyRoomForm.notes}
                        onChange={(e) =>
                          setReadyRoomForm((p) => ({ ...p, notes: e.target.value }))
                        }
                        placeholder="Es. Biancheria cambiata e controllo completato"
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-sm py-2.5 rounded-xl cursor-pointer"
                    >
                      Invia Avviso Camera Pronta
                    </button>
                  </form>

                  <div className="lg:col-span-7">{renderReadyRoomsBox(null)}</div>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    if (!maintForm.area.trim() || !maintForm.description.trim()) {
                      notify("Compila Camera/Area e Descrizione dell'intervento.");
                      return;
                    }
                    const ok = createMaintenanceTicket({
                      area: maintForm.area,
                      description: maintForm.description,
                      priority: maintForm.priority,
                      fromRole: "Lavanderia",
                      signedBy: maintForm.signedBy,
                      assignedTechnician: maintForm.assignedTechnician
                    });
                    if (ok) {
                      setMaintForm({
                        area: "",
                        description: "",
                        priority: "Media",
                        signedBy: "",
                        assignedTechnician: techniciansList[0]?.name || "Paolo Mancini"
                      });
                      notify("Intervento di Lavanderia inviato a Manutenzione.");
                    }
                  }}
                  className="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 space-y-4"
                >
                  <div>
                    <h3 className="text-base font-bold text-slate-900">
                      Inserisci Intervento (Lavanderia → Manutenzione)
                    </h3>
                    <p className="text-xs text-slate-500">
                      Segnala guasti o interventi tecnici con firma e esecutore
                    </p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Camera / Area</label>
                      <input
                        type="text"
                        value={maintForm.area}
                        onChange={(e) => setMaintForm((p) => ({ ...p, area: e.target.value }))}
                        placeholder="Es. Camera 114 / Locale Lavanderia"
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Priorità</label>
                      <select
                        value={maintForm.priority}
                        onChange={(e) => setMaintForm((p) => ({ ...p, priority: e.target.value }))}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                      >
                        {IMPORTANCE_LEVELS.map((lvl) => (
                          <option key={lvl} value={lvl}>
                            {lvl}
                          </option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Intervento</label>
                      <input
                        type="text"
                        value={maintForm.description}
                        onChange={(e) => setMaintForm((p) => ({ ...p, description: e.target.value }))}
                        placeholder="Es. Controllo scarico / asciugatrice"
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {renderStaffSignatureSelect(
                      maintForm.signedBy,
                      (val) => setMaintForm((p) => ({ ...p, signedBy: val })),
                      "Firma intervento"
                    )}
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">
                        Tecnico assegnato
                      </label>
                      <select
                        value={maintForm.assignedTechnician}
                        onChange={(e) =>
                          setMaintForm((p) => ({ ...p, assignedTechnician: e.target.value }))
                        }
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                      >
                        {data.staff.map((st) => (
                          <option key={st.id} value={st.name}>
                            {st.name} ({st.department})
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="bg-orange-600 hover:bg-orange-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl cursor-pointer"
                  >
                    Invia Intervento
                  </button>
                </form>

                {renderAttendanceBlock(
                  "Presenze Giornalieri — Lavanderia",
                  "Presente, Riposo, Assente ingiustificato, Malattia, Ferie, Infortunio + motivo assenza",
                  staffByDept.lavanderia,
                  "Lavanderia"
                )}

            ) : activeSquareId === "sala" ? (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white rounded-3xl border border-slate-200 p-4">
                    <p className="text-xs font-semibold text-slate-500">Colazione (Ricevimento)</p>
                    <p className="text-2xl font-black text-slate-900 mt-1">{currentMeals.colazione ?? 0}</p>
                  </div>
                  <div className="bg-white rounded-3xl border border-slate-200 p-4">
                    <p className="text-xs font-semibold text-slate-500">Pranzo (Ricevimento)</p>
                    <p className="text-2xl font-black text-slate-900 mt-1">{currentMeals.pranzo ?? 0}</p>
                  </div>
                  <div className="bg-white rounded-3xl border border-slate-200 p-4">
                    <p className="text-xs font-semibold text-slate-500">Cena (Ricevimento)</p>
                    <p className="text-2xl font-black text-slate-900 mt-1">{currentMeals.cena ?? 0}</p>
                  </div>
                </div>

                {renderAttendanceBlock(
                  "Presenze Giornalieri — Sala",
                  "Presente, Riposo, Assente ingiustificato, Malattia, Ferie, Infortunio + motivo assenza",
                  staffByDept.sala,
                  "Sala"
                )}

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                  <form
                    onSubmit={(e) => submitDeptCommunication(e, "Sala")}
                    className="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 space-y-3"
                  >
                    <h3 className="text-base font-bold text-slate-900">Comunicazione Sala</h3>
                    {renderStaffSignatureSelect(
                      commForm.signedBy,
                      (val) => setCommForm((p) => ({ ...p, signedBy: val })),
                      "Firma comunicazione (Sala)"
                    )}
                    <textarea
                      rows={3}
                      value={commForm.message}
                      onChange={(e) => setCommForm((p) => ({ ...p, message: e.target.value }))}
                      placeholder="Scrivi comunicazione di Sala..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                    />
                    <button
                      type="submit"
                      className="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-sm px-4 py-2.5 rounded-xl cursor-pointer"
                    >
                      Invia Comunicazione
                    </button>
                  </form>
                  {renderDeptCommunicationsBox("Sala")}
                </div>
              </div>
            ) : activeSquareId === "cucina" ? (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white rounded-3xl border border-slate-200 p-4">
                    <p className="text-xs font-semibold text-slate-500">Colazione (Ricevimento)</p>
                    <p className="text-2xl font-black text-slate-900 mt-1">{currentMeals.colazione ?? 0}</p>
                  </div>
                  <div className="bg-white rounded-3xl border border-slate-200 p-4">
                    <p className="text-xs font-semibold text-slate-500">Pranzo (Ricevimento)</p>
                    <p className="text-2xl font-black text-slate-900 mt-1">{currentMeals.pranzo ?? 0}</p>
                  </div>
                  <div className="bg-white rounded-3xl border border-slate-200 p-4">
                    <p className="text-xs font-semibold text-slate-500">Cena (Ricevimento)</p>
                    <p className="text-2xl font-black text-slate-900 mt-1">{currentMeals.cena ?? 0}</p>
                  </div>
                </div>

                  "Presenze Giornalieri — Cucina",
                  "Presente, Riposo, Assente ingiustificato, Malattia, Ferie, Infortunio + motivo assenza",
                  staffByDept.cucina,
                  "Cucina"
                )}

                {renderAttendanceBlock(
                  "Presenze Giornalieri — Plonge (Gestite da Cucina)",
                  "Inserimento presenze Plonge a cura della Cucina + motivo assenza",
                  staffByDept.plonge,
                  "Plonge"
                )}

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                  <form
                    onSubmit={(e) => submitDeptCommunication(e, "Cucina")}
                    className="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 space-y-3"
                  >
                    <h3 className="text-base font-bold text-slate-900">Comunicazione Cucina</h3>
                    {renderStaffSignatureSelect(
                      commForm.signedBy,
                      (val) => setCommForm((p) => ({ ...p, signedBy: val })),
                      "Firma comunicazione (Cucina)"
                    )}
                    <textarea
                      rows={3}
                      value={commForm.message}
                      onChange={(e) => setCommForm((p) => ({ ...p, message: e.target.value }))}
                      placeholder="Scrivi comunicazione di Cucina / Plonge..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                    />
                    <button
                      type="submit"
                      className="bg-amber-700 hover:bg-amber-800 text-white font-semibold text-sm px-4 py-2.5 rounded-xl cursor-pointer"
                    >
                      Invia Comunicazione
                    </button>
                  </form>
                  {renderDeptCommunicationsBox("Cucina")}
                </div>
              </div>
            ) : activeSquareId === "manutenzione" ? (
              <div className="space-y-6">
                {renderMaintenanceList(true)}
                {renderAttendanceBlock(
                  "Presenze Giornalieri — Manutenzione",
                  "Presente, Riposo, Assente ingiustificato, Malattia, Ferie, Infortunio + motivo assenza",
                  staffByDept.manutenzione,
                  "Manutenzione"
                )}
              </div>
            ) : activeSquareId === "personale_contratti" ? (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                <form
                  onSubmit={addStaffMember}
                  className="lg:col-span-5 bg-white rounded-3xl border border-slate-200 shadow-sm p-5 space-y-3.5"
                >
                  <div>
                    <h2 className="text-lg font-bold text-slate-900">Nuovo Dipendente</h2>
                    <p className="text-xs text-slate-500">
                      Inserisci nome, ruolo, reparto e data di inizio e fine contratto
                    </p>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Nome e Cognome</label>
                    <input
                      type="text"
                      value={staffForm.name}
                      onChange={(e) => setStaffForm((p) => ({ ...p, name: e.target.value }))}
                      placeholder="Es. Matteo Rossi"
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Ruolo</label>
                      <input
                        type="text"
                        value={staffForm.role}
                        onChange={(e) => setStaffForm((p) => ({ ...p, role: e.target.value }))}
                        placeholder="Es. Cameriere / Cuoco"
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Reparto</label>
                      <select
                        value={staffForm.department}
                        onChange={(e) => setStaffForm((p) => ({ ...p, department: e.target.value }))}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                      >
                        {DEPARTMENTS.map((d) => (
                          <option key={d} value={d}>
                            {d}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Inizio contratto</label>
                      <input
                        type="date"
                        value={staffForm.contractStart}
                        onChange={(e) =>
                          setStaffForm((p) => ({ ...p, contractStart: e.target.value }))
                        }
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Fine contratto</label>
                      <input
                        type="date"
                        value={staffForm.contractEnd}
                        onChange={(e) =>
                          setStaffForm((p) => ({ ...p, contractEnd: e.target.value }))
                        }
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-violet-700 hover:bg-violet-800 text-white font-semibold text-sm py-2.5 rounded-xl cursor-pointer"
                  >
                    Salva Dipendente
                  </button>
                </form>

                <div className="lg:col-span-7 bg-white rounded-3xl border border-slate-200 shadow-sm p-5 space-y-3">
                  <h3 className="text-base font-bold text-slate-900">
                    Elenco Personale &amp; Contratti ({data.staff.length})
                  </h3>

                  <div className="divide-y divide-slate-100">
                    {data.staff.map((st) => (
                      <div
                        key={st.id}
                        className="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2"
                      >
                        <div>
                          <p className="text-sm font-bold text-slate-900">{st.name}</p>
                          <p className="text-xs text-slate-500">
                            {st.role} • <span className="font-semibold text-slate-700">{st.department}</span>
                          </p>
                          <p className="text-xs text-slate-500">
                            Contratto: {st.contractStart} → {st.contractEnd}
                          </p>
                        </div>

                        <button
                          type="button"
                          onClick={() => removeStaffMember(st.id)}
                          className="text-xs font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-xl self-start sm:self-center cursor-pointer"
                        >
                          Rimuovi
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ) : (
              <div className="space-y-6">
                {canViewReport && renderReportPanelContent(true)}
                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900">
                        Storico Generale Attività
                      </h2>
                      <p className="text-xs text-slate-500">
                        Cronologia completa di presenze, motivi assenza, coperti, note, camere pronte, lamentele, manutenzioni e contratti
                      </p>
                    </div>

                    <div className="flex flex-wrap items-center gap-2">
                      {canViewReport && (
                        <>
                          <button
                            type="button"
                            onClick={() => downloadPdfExport("PRESENZE")}
                            className="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs px-3.5 py-2 rounded-xl cursor-pointer"
                          >
                            PDF Presenze
                          </button>
                          <button
                            type="button"
                            onClick={() => downloadPdfExport("MANUTENZIONI")}
                            className="bg-amber-700 hover:bg-amber-800 text-white font-bold text-xs px-3.5 py-2 rounded-xl cursor-pointer"
                          >
                            PDF Manutenzioni
                          </button>
                          <button
                            type="button"
                            onClick={() => downloadPdfExport("COMPLETO")}
                            className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs px-3.5 py-2 rounded-xl cursor-pointer"
                          >
                            PDF Report Completo
                          </button>
                        </>
                      )}

                      <select
                        value={historyFilter}
                        onChange={(e) => setHistoryFilter(e.target.value)}
                        className="rounded-xl border border-slate-300 bg-slate-50 px-3 py-2 text-xs sm:text-sm font-semibold"
                      >
                        <option value="Tutti">Tutte le categorie</option>
                        <option value="Presenze">Presenze</option>
                        <option value="Coperti Ospiti">Coperti Ospiti</option>
                        <option value="Note Direzione">Note Direzione</option>
                        <option value="Comunicazioni">Comunicazioni</option>
                        <option value="Manutenzioni">Manutenzioni</option>
                        <option value="Camere Pronte">Camere Pronte</option>
                        <option value="Lamentele Clienti">Lamentele Clienti</option>
                        <option value="Personale & Contratti">Personale &amp; Contratti</option>
                      </select>
                    </div>
                  </div>

                  <div className="space-y-2.5">
                    {filteredHistoryRows.map((h) => (
                      <div
                        key={h.id}
                        className="rounded-2xl border border-slate-200 bg-slate-50/70 p-3.5 space-y-1"
                      >
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <span className="text-xs font-extrabold uppercase tracking-wider text-slate-700">
                            {h.type} • {h.department}
                          </span>
                          <span className="text-[11px] text-slate-400">{h.createdAt}</span>
                        </div>
                        <p className="text-sm font-bold text-slate-900">{h.summary}</p>
                        {h.detail && <p className="text-xs text-slate-600">{h.detail}</p>}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>

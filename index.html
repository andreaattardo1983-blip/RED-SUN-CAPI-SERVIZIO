<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCHEDE LAVORO 2027 — RED SUN App Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .sheet-cell-box:focus {
      outline: 2px solid #059669;
      outline-offset: -2px;
      position: relative;
      z-index: 4;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-slate-50 to-emerald-50/40 text-slate-900 min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STORAGE_KEY = "red_sun_2027_hub_v1";

    const INITIAL_ITEMS = [
      {
        id: "rs-1",
        title: "Giornaliera",
        relPath: "RED SUN 2027\\GIORNALIERA RED SUN  2027.xlsx",
        category: "Operativo",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-2",
        title: "Budget",
        relPath: "RED SUN 2027\\BUDGET 2027 RED SUN.xlsx",
        category: "Amministrazione",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-3",
        title: "Avanzamento lavori giornaliero",
        relPath: "RED SUN 2027\\AVANZAMENTO LAVORI GIORNALIERO RED SUN 2026.xlsx",
        category: "Operativo",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-4",
        title: "Contratti + Richiesta d'Assunzione",
        relPath: "RED SUN 2027\\CONTRATTI + RICHIESTA D'ASSUNZIONE RED SUN 2027.xlsx",
        category: "Personale",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-5",
        title: "Giornaliera Arminzos",
        relPath: "RED SUN 2027\\GIORNALIERA ARMINZOS 2027.xlsx",
        category: "Operativo",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-6",
        title: "Fatture/ddt",
        relPath: "RED SUN 2027\\FATTURE 2027 RED SUN.xlsx",
        category: "Amministrazione",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-7",
        title: "Presenze Animazione",
        relPath: "",
        category: "Personale",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-8",
        title: "Sistemazione alloggi",
        relPath: "",
        category: "Logistica",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-9",
        title: "Contratti d'appalto",
        relPath: "",
        category: "Contratti",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-10",
        title: "Sidec",
        relPath: "",
        category: "Gestione",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-11",
        title: "Password",
        relPath: "",
        category: "Sicurezza",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-12",
        title: "Formulario Rifiuti",
        relPath: "",
        category: "Adempimenti",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-13",
        title: "Isola Gas",
        relPath: "",
        category: "Logistica",
        hasFile: false,
        workbookBase64: null
      },
      {
        id: "rs-14",
        title: "Contratti appartamenti",
        relPath: "",
        category: "Contratti",
        hasFile: false,
        workbookBase64: null
      }
    ];

    async function buildEmptyBase64() {
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet("Foglio1");
      ws.getRow(1).values = ["Voce", "Note", "Stato", "Aggiornamento"];
      for (let r = 1; r <= 10; r++) ws.getRow(r).height = 26;
      ws.columns = [{ width: 24 }, { width: 28 }, { width: 16 }, { width: 18 }];
      const buf = await wb.xlsx.writeBuffer();
      const bytes = new Uint8Array(buf);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function base64ToUint8Array(b64) {
      const binaryString = atob(b64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
      return bytes;
    }

    function uint8ArrayToBase64(bytes) {
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function App() {
      const [items, setItems] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return INITIAL_ITEMS;
      });

      const [search, setSearch] = useState("");
      const [onlyLinked, setOnlyLinked] = useState(false);
      const [activeId, setActiveId] = useState(null);
      const [sheetZoom, setSheetZoom] = useState(100);
      const [gridData, setGridData] = useState([]);
      const [statusMsg, setStatusMsg] = useState("");
      const fileInputRefs = useRef({});

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        } catch (e) {}
      }, [items]);

      const notify = (msg) => {
        setStatusMsg(msg);
        setTimeout(() => setStatusMsg((p) => (p === msg ? "" : p)), 3000);
      };

      const copyPath = async (relPath, title) => {
        if (!relPath) {
          notify(`Nessun link ancora assegnato a "${title}".`);
          return;
        }
        try {
          await navigator.clipboard.writeText(relPath);
          notify(`Copiato percorso: ${relPath}`);
        } catch (e) {
          notify(`Percorso: ${relPath}`);
        }
      };

      const handleFileUpload = (id, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
          const bytes = new Uint8Array(e.target.result);
          const b64 = uint8ArrayToBase64(bytes);
          setItems((prev) =>
            prev.map((it) =>
              it.id === id
                ? {
                    ...it,
                    hasFile: true,
                    workbookBase64: b64,
                    relPath: it.relPath || `RED SUN 2027\\${file.name}`
                  }
                : it
            )
          );
          notify(`File "${file.name}" caricato per l'anteprima.`);
        };
        reader.readAsArrayBuffer(file);
      };

      const openPreview = async (item) => {
        setActiveId(item.id);
        setSheetZoom(100);
        const wb = new ExcelJS.Workbook();
        const b64 = item.workbookBase64 || (await buildEmptyBase64());
        await wb.xlsx.load(base64ToUint8Array(b64).buffer);
        const ws = wb.worksheets[0];
        const rows = [];
        const maxR = Math.max(10, ws.rowCount || 10);
        const maxC = Math.max(4, ws.columnCount || 4);
        for (let r = 1; r <= maxR; r++) {
          const rowArr = [];
          for (let c = 1; c <= maxC; c++) {
            const val = ws.getRow(r).getCell(c).value;
            rowArr.push(val === null || val === undefined ? "" : String(typeof val === "object" ? (val.result ?? val.text ?? "") : val));
          }
          rows.push(rowArr);
        }
        setGridData(rows);
      };

      const addNewCard = () => {
        const idx = items.length + 1;
        setItems((prev) => [
          ...prev,
          {
            id: `rs-${Date.now()}`,
            title: `Nuova Scheda ${idx}`,
            relPath: "",
            category: "Gestione",
            hasFile: false,
            workbookBase64: null
          }
        ]);
        notify("Nuova scheda aggiunta.");
      };

      const resetDefaults = () => {
        setItems(INITIAL_ITEMS);
        localStorage.removeItem(STORAGE_KEY);
        notify("Ripristinate le 14 schede RED SUN 2027.");
      };

      const filtered = items.filter((it) => {
        const q = search.trim().toLowerCase();
        const matchText =
          !q ||
          it.title.toLowerCase().includes(q) ||
          (it.relPath && it.relPath.toLowerCase().includes(q)) ||
          (it.category && it.category.toLowerCase().includes(q));
        const matchLink = !onlyLinked || Boolean(it.relPath);
        return matchText && matchLink;
      });

      const activeItem = items.find((i) => i.id === activeId) || null;
      const linkedCount = items.filter((i) => Boolean(i.relPath)).length;

      return (
        <div className="min-h-screen w-full px-4 sm:px-6 lg:px-8 py-6">
          <div className="w-full max-w-[1640px] mx-auto space-y-6">
            {statusMsg && (
              <div className="rounded-2xl bg-slate-900 text-white px-5 py-3 text-sm font-medium shadow-lg flex items-center justify-between">
                <span>{statusMsg}</span>
                <span className="text-xs text-emerald-300 font-semibold">OK</span>
              </div>
            )}

            {!activeItem ? (
              <>
                <header className="bg-white/95 backdrop-blur rounded-3xl border border-slate-200/80 shadow-sm px-6 py-5 flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-700 text-white flex items-center justify-center font-bold text-base shadow-md shadow-emerald-600/20">
                      RS27
                    </div>
                    <div>
                      <div className="flex flex-wrap items-center gap-2">
                        <h1 className="text-2xl font-bold tracking-tight text-slate-900">
                          SCHEDE LAVORO 2027 — RED SUN
                        </h1>
                        <span className="text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full">
                          {linkedCount} con link file
                        </span>
                      </div>
                      <p className="text-sm text-slate-500 mt-0.5">
                        Dashboard operativa in stile app per consultare, copiare il percorso o aprire l'anteprima delle schede
                      </p>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2.5">
                    <button
                      type="button"
                      onClick={addNewCard}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-4 py-2.5 rounded-2xl transition cursor-pointer"
                    >
                      + Nuova Scheda
                    </button>
                    <button
                      type="button"
                      onClick={resetDefaults}
                      className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs px-3.5 py-2.5 rounded-2xl transition cursor-pointer"
                    >
                      Ripristina elenco
                    </button>
                  </div>
                </header>

                <div className="bg-white/90 rounded-2xl border border-slate-200/80 p-4 flex flex-wrap items-center justify-between gap-3">
                  <input
                    type="text"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Cerca scheda (es. Giornaliera, Budget, Fatture, Arminzos, Password...)"
                    className="flex-1 min-w-[240px] bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-emerald-500"
                  />
                  <label className="inline-flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer select-none">
                    <input
                      type="checkbox"
                      checked={onlyLinked}
                      onChange={(e) => setOnlyLinked(e.target.checked)}
                      className="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500"
                    />
                    Solo schede con link file
                  </label>
                </div>

                <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                  {filtered.map((item) => (
                    <article
                      key={item.id}
                      className="bg-white rounded-3xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-emerald-300 transition p-5 flex flex-col justify-between gap-4"
                    >
                      <div className="space-y-2">
                        <div className="flex items-center justify-between gap-2">
                          <span className="text-[11px] font-semibold uppercase tracking-wider bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">
                            {item.category || "Scheda"}
                          </span>
                          {item.relPath ? (
                            <span className="text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded-full">
                              Link attivo
                            </span>
                          ) : (
                            <span className="text-xs font-medium text-slate-400 bg-slate-50 border border-slate-200 px-2.5 py-0.5 rounded-full">
                              Senza link
                            </span>
                          )}
                        </div>

                        <h2 className="text-lg font-bold text-slate-900 pt-1">{item.title}</h2>

                        <p className="text-xs text-slate-500 break-all bg-slate-50 border border-slate-200/70 rounded-xl p-2.5 min-h-[44px]">
                          {item.relPath ? item.relPath : "Nessun file Excel collegato in questo riquadro"}
                        </p>
                      </div>

                      <div className="space-y-2 pt-1">
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            type="button"
                            onClick={() => copyPath(item.relPath, item.title)}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs py-2.5 px-3 rounded-xl transition cursor-pointer"
                          >
                            Copia percorso
                          </button>
                          <button
                            type="button"
                            onClick={() => openPreview(item)}
                            className="bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs py-2.5 px-3 rounded-xl transition cursor-pointer"
                          >
                            Anteprima
                          </button>
                        </div>

                        <button
                          type="button"
                          onClick={() => fileInputRefs.current[item.id]?.click()}
                          className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs py-2 px-3 rounded-xl transition cursor-pointer"
                        >
                          ↑ Carica .xlsx per anteprima
                        </button>
                        <input
                          ref={(el) => (fileInputRefs.current[item.id] = el)}
                          type="file"
                          accept=".xlsx"
                          className="hidden"
                          onChange={(e) => {
                            handleFileUpload(item.id, e.target.files?.[0]);
                            e.target.value = "";
                          }}
                        />
                      </div>
                    </article>
                  ))}
                </section>
              </>
            ) : (
              <section className="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-5 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-4">
                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => setActiveId(null)}
                      className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-sm px-4 py-2 rounded-xl cursor-pointer"
                    >
                      ← Schede
                    </button>
                    <div>
                      <h2 className="text-xl font-bold text-slate-900">{activeItem.title}</h2>
                      <p className="text-xs text-slate-500">{activeItem.relPath || "Anteprima rapida"}</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-1 bg-slate-100 border border-slate-200 rounded-xl px-2 py-1">
                    <button
                      type="button"
                      onClick={() => setSheetZoom((z) => Math.max(60, z - 10))}
                      className="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-sm cursor-pointer"
                    >
                      −
                    </button>
                    <button
                      type="button"
                      onClick={() => setSheetZoom(100)}
                      className="px-2.5 py-1 text-xs font-bold cursor-pointer"
                    >
                      {sheetZoom}%
                    </button>
                    <button
                      type="button"
                      onClick={() => setSheetZoom((z) => Math.min(160, z + 10))}
                      className="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-sm cursor-pointer"
                    >
                      +
                    </button>
                  </div>
                </div>

                <div className="overflow-auto max-h-[65vh] border border-slate-200 rounded-2xl bg-slate-50 p-3">
                  <div
                    style={{
                      transform: `scale(${sheetZoom / 100})`,
                      transformOrigin: "top left",
                      width: `${100 / (sheetZoom / 100)}%`
                    }}
                  >
                    <table className="border-collapse bg-white">
                      <tbody>
                        {gridData.map((row, rIdx) => (
                          <tr key={rIdx}>
                            {row.map((cell, cIdx) => (
                              <td
                                key={cIdx}
                                className="border border-slate-200 min-w-[160px] h-9 p-0"
                              >
                                <textarea
                                  rows={1}
                                  value={cell}
                                  onChange={(e) => {
                                    const val = e.target.value;
                                    setGridData((prev) =>
                                      prev.map((r, ri) =>
                                        ri === rIdx ? r.map((c, ci) => (ci === cIdx ? val : c)) : r
                                      )
                                    );
                                  }}
                                  className="sheet-cell-box w-full h-full px-2.5 py-1.5 text-sm resize-none bg-transparent"
                                />
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </section>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>

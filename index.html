<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Hub — Carica, Scarica e Stampa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      .print-area {
        overflow: visible !important;
        max-height: none !important;
        border: none !important;
        padding: 0 !important;
        background: #ffffff !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STORAGE_KEY = "excel_hub_carica_scarica_stampa_v1";

    const INITIAL_TILES = [
      { id: "t-1", title: "Giornaliera", fileName: "Giornaliera.xlsx", hasFile: false, workbookBase64: null },
      { id: "t-2", title: "Budget", fileName: "Budget.xlsx", hasFile: false, workbookBase64: null },
      { id: "t-3", title: "Avanzamento lavori giornaliero", fileName: "Avanzamento_Lavori.xlsx", hasFile: false, workbookBase64: null },
      { id: "t-4", title: "Contratti + Richiesta d'Assunzione", fileName: "Contratti_Assunzione.xlsx", hasFile: false, workbookBase64: null },
      { id: "t-5", title: "Giornaliera Arminzos", fileName: "Giornaliera_Arminzos.xlsx", hasFile: false, workbookBase64: null },
      { id: "t-6", title: "Fatture/ddt", fileName: "Fatture_DDT.xlsx", hasFile: false, workbookBase64: null }
    ];

    function uint8ArrayToBase64(bytes) {
      let bin = "";
      for (let i = 0; i < bytes.length; i++) {
        bin += String.fromCharCode(bytes[i]);
      }
      return btoa(bin);
    }

    function base64ToUint8Array(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function buildBlankWorkbookBase64() {
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet("Foglio1");
      ws.addRow(["Voce", "Dettagli", "Note", "Stato"]);
      for (let r = 2; r <= 12; r++) {
        ws.addRow(["", "", "", ""]);
      }
      ws.columns = [{ width: 24 }, { width: 28 }, { width: 24 }, { width: 18 }];
      const buf = await wb.xlsx.writeBuffer();
      return uint8ArrayToBase64(new Uint8Array(buf));
    }

    function App() {
      const [tiles, setTiles] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return INITIAL_TILES;
      });

      const [activeId, setActiveId] = useState(null);
      const [zoom, setZoom] = useState(100);
      const [rows, setRows] = useState([]);
      const [message, setMessage] = useState("");
      const inputRefs = useRef({});

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tiles));
        } catch (e) {}
      }, [tiles]);

      const showBanner = (text) => {
        setMessage(text);
        setTimeout(() => {
          setMessage((prev) => (prev === text ? "" : prev));
        }, 3000);
      };

      const addTile = () => {
        const n = tiles.length + 1;
        setTiles((prev) => [
          ...prev,
          {
            id: `t-${Date.now()}`,
            title: `Scheda ${n}`,
            fileName: `Scheda_${n}.xlsx`,
            hasFile: false,
            workbookBase64: null
          }
        ]);
        showBanner("Nuovo riquadro aggiunto.");
      };

      const handleUploadFile = (tileId, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const bytes = new Uint8Array(ev.target.result);
            const wb = new ExcelJS.Workbook();
            await wb.xlsx.load(bytes.buffer);
            const b64 = uint8ArrayToBase64(bytes);

            setTiles((prev) =>
              prev.map((t) =>
                t.id === tileId
                  ? {
                      ...t,
                      fileName: file.name,
                      hasFile: true,
                      workbookBase64: b64
                    }
                  : t
              )
            );
            showBanner(`File "${file.name}" caricato.`);
          } catch (err) {
            showBanner("Errore nella lettura del file .xlsx.");
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const downloadTileFile = async (tile) => {
        try {
          let b64 = tile.workbookBase64;
          if (tile.id === activeId && rows.length > 0) {
            const wb = new ExcelJS.Workbook();
            if (b64) {
              await wb.xlsx.load(base64ToUint8Array(b64).buffer);
            }
            const ws = wb.worksheets[0] || wb.addWorksheet("Foglio1");
            ws.spliceRows(1, ws.rowCount);
            rows.forEach((r) => ws.addRow(r));
            const buf = await wb.xlsx.writeBuffer();
            b64 = uint8ArrayToBase64(new Uint8Array(buf));
            setTiles((prev) =>
              prev.map((t) => (t.id === tile.id ? { ...t, hasFile: true, workbookBase64: b64 } : t))
            );
          }

          if (!b64) {
            b64 = await buildBlankWorkbookBase64();
          }

          const bytes = base64ToUint8Array(b64);
          const blob = new Blob([bytes], {
            type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = tile.fileName || `${tile.title}.xlsx`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showBanner(`Scaricato "${tile.fileName || `${tile.title}.xlsx`}".`);
        } catch (err) {
          showBanner("Impossibile scaricare il file.");
        }
      };

      const openSheetView = async (tile) => {
        setActiveId(tile.id);
        setZoom(100);
        const wb = new ExcelJS.Workbook();
        const b64 = tile.workbookBase64 || (await buildBlankWorkbookBase64());
        await wb.xlsx.load(base64ToUint8Array(b64).buffer);
        const ws = wb.worksheets[0];

        const maxR = Math.max(12, ws.rowCount || 12);
        const maxC = Math.max(4, ws.columnCount || 4);
        const matrix = [];

        for (let r = 1; r <= maxR; r++) {
          const rowVals = [];
          for (let c = 1; c <= maxC; c++) {
            const v = ws.getRow(r).getCell(c).value;
            if (v === null || v === undefined) {
              rowVals.push("");
            } else if (typeof v === "object") {
              rowVals.push(String(v.result ?? v.text ?? ""));
            } else {
              rowVals.push(String(v));
            }
          }
          matrix.push(rowVals);
        }
        setRows(matrix);
      };

      const printSheet = () => {
        window.print();
      };

      const activeTile = tiles.find((t) => t.id === activeId) || null;
      const scaleFactor = zoom / 100;

      return (
        <div className="min-h-screen w-full px-4 sm:px-6 lg:px-8 py-6">
          <div className="w-full max-w-[1640px] mx-auto space-y-6">
            {message && (
              <div className="no-print rounded-2xl bg-slate-900 text-white px-5 py-3 text-sm font-medium shadow">
                {message}
              </div>
            )}

            {!activeTile ? (
              <>
                <header className="no-print bg-white rounded-3xl border border-slate-200 shadow-sm px-6 py-5 flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <h1 className="text-2xl font-bold text-slate-900">Excel Hub</h1>
                    <p className="text-sm text-slate-500">
                      Carica file, scarica file e stampa file — vista orizzontale
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={addTile}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-4 py-2.5 rounded-2xl transition cursor-pointer"
                  >
                    + Riquadro
                  </button>
                </header>

                <section className="no-print grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                  {tiles.map((tile) => (
                    <article
                      key={tile.id}
                      className="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between gap-4"
                    >
                      <div>
                        <div className="flex items-center justify-between gap-2 mb-2">
                          <span
                            className={`text-xs font-semibold px-2.5 py-1 rounded-full ${
                              tile.hasFile
                                ? "bg-emerald-50 text-emerald-700 border border-emerald-200"
                                : "bg-slate-100 text-slate-500"
                            }`}
                          >
                            {tile.hasFile ? "File caricato" : "Vuoto"}
                          </span>
                          <button
                            type="button"
                            onClick={() => openSheetView(tile)}
                            className="text-xs font-semibold text-slate-800 bg-slate-100 hover:bg-slate-200 px-3 py-1 rounded-xl cursor-pointer"
                          >
                            Apri
                          </button>
                        </div>

                        <h2 className="text-lg font-bold text-slate-900">{tile.title}</h2>
                        <p className="text-xs text-slate-500 truncate mt-1">{tile.fileName}</p>
                      </div>

                      <div className="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100">
                        <button
                          type="button"
                          onClick={() => inputRefs.current[tile.id]?.click()}
                          className="bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs py-2.5 px-2 rounded-xl cursor-pointer"
                        >
                          Carica file
                        </button>
                        <button
                          type="button"
                          onClick={() => downloadTileFile(tile)}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs py-2.5 px-2 rounded-xl cursor-pointer"
                        >
                          Scarica file
                        </button>
                        <button
                          type="button"
                          onClick={async () => {
                            await openSheetView(tile);
                            setTimeout(() => window.print(), 200);
                          }}
                          className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-xs py-2.5 px-2 rounded-xl cursor-pointer"
                        >
                          Stampa file
                        </button>
                      </div>

                      <input
                        ref={(el) => (inputRefs.current[tile.id] = el)}
                        type="file"
                        accept=".xlsx"
                        className="hidden"
                        onChange={(e) => {
                          handleUploadFile(tile.id, e.target.files?.[0]);
                          e.target.value = "";
                        }}
                      />
                    </article>
                  ))}
                </section>
              </>
            ) : (
              <section className="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 space-y-4">
                <div className="no-print flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-4">
                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => setActiveId(null)}
                      className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-sm px-4 py-2 rounded-xl cursor-pointer"
                    >
                      ← Indietro
                    </button>
                    <div>
                      <h2 className="text-xl font-bold text-slate-900">{activeTile.title}</h2>
                      <p className="text-xs text-slate-500">{activeTile.fileName}</p>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <div className="flex items-center gap-1 bg-slate-100 border border-slate-200 rounded-xl px-2 py-1">
                      <button
                        type="button"
                        onClick={() => setZoom((z) => Math.max(60, z - 10))}
                        className="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-sm cursor-pointer"
                      >
                        −
                      </button>
                      <button
                        type="button"
                        onClick={() => setZoom(100)}
                        className="px-2.5 py-1 text-xs font-bold cursor-pointer"
                      >
                        {zoom}%
                      </button>
                      <button
                        type="button"
                        onClick={() => setZoom((z) => Math.min(160, z + 10))}
                        className="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-sm cursor-pointer"
                      >
                        +
                      </button>
                    </div>

                    <button
                      type="button"
                      onClick={() => inputRefs.current[activeTile.id]?.click()}
                      className="bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs px-3.5 py-2.5 rounded-xl cursor-pointer"
                    >
                      Carica file
                    </button>
                    <button
                      type="button"
                      onClick={() => downloadTileFile(activeTile)}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs px-3.5 py-2.5 rounded-xl cursor-pointer"
                    >
                      Scarica file
                    </button>
                    <button
                      type="button"
                      onClick={printSheet}
                      className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-xs px-3.5 py-2.5 rounded-xl cursor-pointer"
                    >
                      Stampa file
                    </button>
                  </div>
                </div>

                <input
                  ref={(el) => (inputRefs.current[activeTile.id] = el)}
                  type="file"
                  accept=".xlsx"
                  className="hidden"
                  onChange={async (e) => {
                    const f = e.target.files?.[0];
                    e.target.value = "";
                    if (!f) return;
                    const reader = new FileReader();
                    reader.onload = async (ev) => {
                      const bytes = new Uint8Array(ev.target.result);
                      const wb = new ExcelJS.Workbook();
                      await wb.xlsx.load(bytes.buffer);
                      const b64 = uint8ArrayToBase64(bytes);
                      setTiles((prev) =>
                        prev.map((t) =>
                          t.id === activeTile.id
                            ? { ...t, fileName: f.name, hasFile: true, workbookBase64: b64 }
                            : t
                        )
                      );
                      await openSheetView({ ...activeTile, fileName: f.name, hasFile: true, workbookBase64: b64 });
                      showBanner(`Caricato "${f.name}".`);
                    };
                    reader.readAsArrayBuffer(f);
                  }}
                />

                <div className="print-area overflow-auto max-h-[65vh] border border-slate-200 rounded-2xl bg-slate-50 p-3">
                  <div
                    style={{
                      transform: `scale(${scaleFactor})`,
                      transformOrigin: "top left",
                      width: `${100 / scaleFactor}%`
                    }}
                  >
                    <table className="border-collapse bg-white">
                      <tbody>
                        {rows.map((row, rIdx) => (
                          <tr key={rIdx}>
                            {row.map((cell, cIdx) => (
                              <td
                                key={cIdx}
                                className="border border-slate-200 min-w-[160px] h-9 p-0"
                              >
                                <input
                                  type="text"
                                  value={cell}
                                  onChange={(e) => {
                                    const val = e.target.value;
                                    setRows((prev) =>
                                      prev.map((r, ri) =>
                                        ri === rIdx ? r.map((c, ci) => (ci === cIdx ? val : c)) : r
                                      )
                                    );
                                  }}
                                  className={`w-full h-full px-2.5 py-1.5 text-sm bg-transparent focus:outline-none focus:bg-emerald-50/40 ${
                                    rIdx === 0 ? "font-semibold bg-slate-50" : ""
                                  }`}
                                />
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </section>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>

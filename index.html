<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grand Hotel — Capi Servizio Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .press-btn {
      transition: transform 120ms ease, background-color 150ms ease, box-shadow 150ms ease;
    }
    .press-btn:active {
      transform: scale(0.97);
    }
    .attendance-scroll::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    .attendance-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .attendance-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-50/70 via-slate-100 to-sky-50/70 text-slate-900 min-h-screen antialiased selection:bg-amber-200 selection:text-slate-950">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const CLOUD_STORAGE_KEY = "grand_hotel_capi_servizio_hub_v1";
    const SHARED_DOC_PATH = ["hotel_hub_shared", "shared_state"];

    let cloudDb = null;
    let cloudAuth = null;
    let cloudUser = null;
    let cloudReady = false;
    let cloudErrorState = false;
    let isApplyingRemoteSync = false;
    let unsubscribeSnapshot = null;
    let lastAppliedRemoteUpdatedAt = 0;
    let lastRemoteEventLabel = "Solo Locale (No Cloud)";

    const SHARED_STATE_KEYS = [
      "sectorCredentials",
      "staff",
      "monthlyAttendance",
      "serviceNotes",
      "mealMovements",
      "intoleranceNotices",
      "roomChangeNotices",
      "maintenanceTickets",
      "complaints",
      "archiveEntries"
    ];

    function formatErrCode(err, prefix) {
      const raw = String(err?.code || err?.message || "errore");
      return raw.replace("auth/", `${prefix}:`).replace("firestore/", `${prefix}:`).slice(0, 48);
    }

    function setCloudBannerStatus(label, { ready = false, error = false } = {}) {
      cloudReady = ready;
      cloudErrorState = error;
      lastRemoteEventLabel = label;
      if (typeof render === "function") render();
    }

    function extractSharedPayload(sourceObj) {
      const payload = {};
      SHARED_STATE_KEYS.forEach((key) => {
        if (sourceObj && sourceObj[key] !== undefined) {
          payload[key] = JSON.parse(JSON.stringify(sourceObj[key]));
        }
      });
      return payload;
    }

    function applySharedPayloadToState(payload) {
      if (!payload || typeof payload !== "object" || typeof state === "undefined") return false;
      const remoteUpdatedAt = Number(payload.updatedAt || 0);
      if (remoteUpdatedAt && remoteUpdatedAt <= lastAppliedRemoteUpdatedAt) {
        return false;
      }

      isApplyingRemoteSync = true;
      try {
        SHARED_STATE_KEYS.forEach((key) => {
          if (payload[key] !== undefined) {
            state[key] = JSON.parse(JSON.stringify(payload[key]));
          }
        });

        if (Array.isArray(state.complaints)) {
          state.complaints = state.complaints.map((c) => {
            const st = c?.status;
            if (st === "Gestita") return { ...c, status: "Risolta" };
            if (st === "Da gestire") return { ...c, status: "Aperta" };
            return { ...c, status: ["Aperta", "In lavorazione", "Risolta"].includes(st) ? st : "Aperta" };
          });
        }

        if (remoteUpdatedAt) {
          lastAppliedRemoteUpdatedAt = remoteUpdatedAt;
          const timeStr = new Date(remoteUpdatedAt).toLocaleTimeString("it-IT", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          });
          lastRemoteEventLabel = `Agg. ${timeStr} (${String(payload.updatedBy || "remoto")})`;
          cloudReady = true;
          cloudErrorState = false;
        }

        try {
          const {
            isAuthenticated,
            pendingRoleId,
            passwordDraft,
            passwordError,
            loginPasswordDraft,
            loginError,
            ...persistable
          } = state;
          localStorage.setItem(CLOUD_STORAGE_KEY, JSON.stringify(persistable));
        } catch (err) {
          console.warn("Salvataggio locale durante sync non riuscito:", err);
        }
        return true;
      } finally {
        isApplyingRemoteSync = false;
      }
    }

    async function pushSharedStateToCloud() {
      if (!cloudReady || !cloudDb || isApplyingRemoteSync || typeof state === "undefined") return;
      try {
        const nowTs = Date.now();
        lastAppliedRemoteUpdatedAt = nowTs;
        const docRef = doc(cloudDb, ...SHARED_DOC_PATH);
        const safePayload = extractSharedPayload(state);
        await setDoc(
          docRef,
          {
            ...safePayload,
            updatedAt: nowTs,
            updatedBy: String(state.activeRole || "unknown")
          },
          { merge: true }
        );
        const timeStr = new Date(nowTs).toLocaleTimeString("it-IT", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
        setCloudBannerStatus(`Agg. ${timeStr}`, { ready: true, error: false });
      } catch (err) {
        console.warn("Scrittura cloud non riuscita:", err);
        setCloudBannerStatus(`No Cloud (${formatErrCode(err, "db")})`, {
          ready: false,
          error: true
        });
      }
    }

    async function pullLatestFromCloud() {
      if (!cloudReady || !cloudDb) return false;
      try {
        const docRef = doc(cloudDb, ...SHARED_DOC_PATH);
        const snap = await getDoc(docRef);
        if (snap.exists()) {
          return applySharedPayloadToState(snap.data());
        }
      } catch (err) {
        console.warn("Lettura cloud non riuscita:", err);
        setCloudBannerStatus(`No Cloud (${formatErrCode(err, "db")})`, { ready: false, error: true });
      }
      return false;
    }

    async function attachRealtimeListener() {
      if (!cloudDb || unsubscribeSnapshot) return;
      const docRef = doc(cloudDb, ...SHARED_DOC_PATH);
      unsubscribeSnapshot = onSnapshot(
        docRef,
        (snapshot) => {
          if (!snapshot.exists() || isApplyingRemoteSync) return;
          const changed = applySharedPayloadToState(snapshot.data());
          if (changed && typeof render === "function") {
            render();
          }
        },
        (err) => {
          console.warn("Ascolto in tempo reale interrotto:", err);
          setCloudBannerStatus(`No Cloud (${formatErrCode(err, "db")})`, {
            ready: false,
            error: true
          });
        }
      );
    }

    async function initCloudSync() {
      let authErrCode = "";
      try {
        const firebaseConfig = {
          apiKey: "AIzaSyBv1urcYU3v1ZV9GIemgjP7LxNpLoF7Nyw",
          authDomain: "red-sun-2027-capi-servizio.firebaseapp.com",
          projectId: "red-sun-2027-capi-servizio",
          storageBucket: "red-sun-2027-capi-servizio.firebasestorage.app",
          messagingSenderId: "1007180727881",
          appId: "1:1007180727881:web:f510265c8b847d6cc26198"
        };

        const app = initializeApp(firebaseConfig);
        cloudAuth = getAuth(app);
        cloudDb = getFirestore(app);

        try {
          if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
            await signInWithCustomToken(cloudAuth, __initial_auth_token);
          } else {
            await signInAnonymously(cloudAuth);
          }
          cloudUser = cloudAuth.currentUser;
        } catch (authErr) {
          authErrCode = formatErrCode(authErr, "auth");
          console.warn("Auth fallita, provo accesso diretto Firestore:", authErr);
        }

        const docRef = doc(cloudDb, ...SHARED_DOC_PATH);
        const snap = await getDoc(docRef);
        setCloudBannerStatus("Connesso al Cloud", { ready: true, error: false });

        if (snap.exists()) {
          applySharedPayloadToState(snap.data());
          if (typeof render === "function") render();
        } else {
          await pushSharedStateToCloud();
        }

        await attachRealtimeListener();
      } catch (err) {
        console.warn("Modalità locale attiva:", err);
        const dbErrCode = formatErrCode(err, "db");
        const labelDetail = authErrCode ? `${authErrCode} / ${dbErrCode}` : dbErrCode;
        setCloudBannerStatus(`No Cloud (${labelDetail})`, { ready: false, error: true });
      }
    }

    window.__cloudSync = {
      isActive: () => cloudReady,
      getStatus: () => ({
        ready: cloudReady,
        error: cloudErrorState,
        label: lastRemoteEventLabel,
        lastUpdatedAt: lastAppliedRemoteUpdatedAt
      }),
      push: pushSharedStateToCloud,
      pullLatest: pullLatestFromCloud,
      reconnect: initCloudSync
    };

    initCloudSync();
  </script>

  <script>
    const STORAGE_KEY = "grand_hotel_capi_servizio_hub_v1";
    let isArchivingInProgress = false;

    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getCurrentTimeHHMM() {
      const now = new Date();
      return now.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
    }

    function escapeHTML(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const toast = document.createElement("div");
      const styleClass =
        type === "warning"
          ? "bg-amber-900 text-amber-50 border-amber-700"
          : "bg-slate-900 text-white border-slate-700";
      toast.className = `px-4 py-2.5 rounded-xl border text-xs font-bold shadow-lg pointer-events-auto transition-opacity duration-300 ${styleClass}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    const DEPARTMENTS = [
      { id: "direzione", name: "Direzione", badgeClass: "bg-amber-100 text-amber-950 border-amber-300" },
      { id: "ricevimento", name: "Ricevimento", badgeClass: "bg-sky-100 text-sky-900 border-sky-300" },
      { id: "sala", name: "Sala & Ristorazione", badgeClass: "bg-emerald-100 text-emerald-900 border-emerald-300" },
      { id: "cucina", name: "Cucina", badgeClass: "bg-orange-100 text-orange-950 border-orange-300" },
      { id: "governante", name: "Governante", badgeClass: "bg-teal-100 text-teal-900 border-teal-300" },
      { id: "manutenzione", name: "Manutenzione", badgeClass: "bg-violet-100 text-violet-900 border-violet-300" }
    ];

    const ROLES = [
      { id: "director", label: "Direttore", deptId: "direzione" },
      { id: "vice_director", label: "Vice Direttore", deptId: "direzione" },
      { id: "capo_ricevimento", label: "Capo Ricevimento", deptId: "ricevimento" },
      { id: "maitre", label: "Maître / Capo Sala", deptId: "sala" },
      { id: "chef", label: "Executive Chef", deptId: "cucina" },
      { id: "governante", label: "Capo Governante", deptId: "governante" },
      { id: "manutenzione", label: "Capo Manutenzione", deptId: "manutenzione" }
    ];

    const ATTENDANCE_CODES = [
      { code: "P", label: "Presente", cellClass: "bg-emerald-100 text-emerald-900 border-emerald-300" },
      { code: "R", label: "Riposo", cellClass: "bg-sky-100 text-sky-900 border-sky-300" },
      { code: "F", label: "Ferie", cellClass: "bg-amber-100 text-amber-950 border-amber-300" },
      { code: "M", label: "Malattia", cellClass: "bg-rose-100 text-rose-900 border-rose-300" },
      { code: "PE", label: "Permesso", cellClass: "bg-violet-100 text-violet-900 border-violet-300" },
      { code: ".", label: "Vuoto", cellClass: "bg-white text-slate-400 border-slate-200" }
    ];

    const ARCHIVE_CATEGORIES = [
      { id: "ordini_servizio", label: "Ordini & Note di Servizio", icon: "📋", badgeClass: "bg-sky-100 text-sky-900 border-sky-200" },
      { id: "cambi_camera", label: "Cambi Camera", icon: "🔑", badgeClass: "bg-teal-100 text-teal-900 border-teal-200" },
      { id: "movimento_pasti", label: "Movimento Pasti & Packet", icon: "🍽️", badgeClass: "bg-amber-100 text-amber-950 border-amber-200" },
      { id: "pasti_intolleranze", label: "Intolleranze Alimentari", icon: "🥗", badgeClass: "bg-orange-100 text-orange-950 border-orange-200" },
      { id: "manutenzione_ospiti", label: "Manutenzione", icon: "🛠️", badgeClass: "bg-violet-100 text-violet-900 border-violet-200" },
      { id: "lamentela_clienti", label: "Lamentele Clienti", icon: "📣", badgeClass: "bg-rose-100 text-rose-900 border-rose-200" }
    ];

    const todayISO = getTodayISO();
    const currentMonthYM = todayISO.slice(0, 7);

    const DEFAULT_STATE = {
      isAuthenticated: false,
      activeRole: "director",
      activeSection: null,
      selectedDate: todayISO,
      selectedMonth: currentMonthYM,
      editAttendanceMode: true,
      selectedBrushCode: "P",
      lastSelectedCell: null,
      loginUsernameDraft: "",
      loginPasswordDraft: "",
      loginError: "",
      pendingRoleId: null,
      passwordDraft: "",
      passwordError: "",
      credentialDraftsByKey: {},
      noteSelectAllDepts: true,
      noteSelectedDeptIds: DEPARTMENTS.map((d) => d.id),
      archiveFilterCategory: null,
      archiveSearchQuery: "",
      archiveDateFilter: "",
      sectorCredentials: {
        director: { username: "direttore", password: "" },
        vice_director: { username: "vicedirettore", password: "" },
        ricevimento: { username: "ricevimento", password: "" },
        sala: { username: "sala", password: "" },
        cucina: { username: "cucina", password: "" },
        governante: { username: "governante", password: "" },
        manutenzione: { username: "manutenzione", password: "" }
      },
      staff: [
        { id: "st_1", name: "Marco Rossi", role: "Capo Ricevimento", deptId: "ricevimento" },
        { id: "st_2", name: "Giulia Verdi", role: "Receptionist", deptId: "ricevimento" },
        { id: "st_3", name: "Antonio Conti", role: "Maître di Sala", deptId: "sala" },
        { id: "st_4", name: "Elena Ferrari", role: "Chef de Rang", deptId: "sala" },
        { id: "st_5", name: "Lorenzo Greco", role: "Executive Chef", deptId: "cucina" },
        { id: "st_6", name: "Sofia Rinaldi", role: "Capo Governante", deptId: "governante" },
        { id: "st_7", name: "Davide Lombardi", role: "Addetto Manutenzione", deptId: "manutenzione" }
      ],
      monthlyAttendance: {},
      serviceNotes: [],
      mealMovements: {},
      intoleranceNotices: [],
      roomChangeNotices: [],
      maintenanceTickets: [],
      complaints: [],
      archiveEntries: []
    };

    const state = JSON.parse(JSON.stringify(DEFAULT_STATE));

    function loadInitialState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return;
        const protectedSessionKeys = ["isAuthenticated", "pendingRoleId", "loginPasswordDraft", "loginError"];
        Object.keys(DEFAULT_STATE).forEach((k) => {
          if (protectedSessionKeys.includes(k)) return;
          if (parsed[k] !== undefined) {
            state[k] = parsed[k];
          }
        });
        state.isAuthenticated = false;
        if (!state.selectedDate) state.selectedDate = getTodayISO();
        if (!state.selectedMonth) state.selectedMonth = state.selectedDate.slice(0, 7);
        if (!Array.isArray(state.noteSelectedDeptIds)) {
          state.noteSelectedDeptIds = DEPARTMENTS.map((d) => d.id);
        }
      } catch (err) {
        console.warn("Errore lettura stato locale:", err);
      }
    }

    function saveState() {
      try {
        const {
          isAuthenticated,
          pendingRoleId,
          passwordDraft,
          passwordError,
          loginPasswordDraft,
          loginError,
          ...persistable
        } = state;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(persistable));
      } catch (err) {
        console.warn("Errore salvataggio stato locale:", err);
      }
      if (window.__cloudSync && typeof window.__cloudSync.push === "function") {
        window.__cloudSync.push();
      }
    }

    function syncSharedStateFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        [
          "sectorCredentials",
          "staff",
          "monthlyAttendance",
          "serviceNotes",
          "mealMovements",
          "intoleranceNotices",
          "roomChangeNotices",
          "maintenanceTickets",
          "complaints",
          "archiveEntries"
        ].forEach((key) => {
          if (parsed[key] !== undefined) {
            state[key] = parsed[key];
          }
        });
      } catch (err) {
        console.warn("Sync da storage fallita:", err);
      }
    }

    loadInitialState();

    function getCurrentRoleObj() {
      return ROLES.find((r) => r.id === state.activeRole) || ROLES[0];
    }

    function getDepartmentObj(deptId) {
      return DEPARTMENTS.find((d) => d.id === deptId) || DEPARTMENTS[0];
    }

    function isDirectorOrVice() {
      return state.activeRole === "director" || state.activeRole === "vice_director";
    }

    function isMaintenanceRole() {
      return state.activeRole === "manutenzione";
    }

    function getRoleSectorKey(roleId) {
      const r = ROLES.find((item) => item.id === roleId);
      if (!r) return "director";
      if (roleId === "director" || roleId === "vice_director") return roleId;
      return r.deptId;
    }

    function getSectorCredential(sectorKey) {
      const entry = state.sectorCredentials?.[sectorKey];
      if (typeof entry === "string") {
        return { username: sectorKey, password: entry };
      }
      return {
        username: entry?.username || sectorKey,
        password: entry?.password || ""
      };
    }

    function getSectorUsername(sectorKey) {
      return getSectorCredential(sectorKey).username;
    }

    function getSectorPassword(sectorKey) {
      return getSectorCredential(sectorKey).password;
    }

    function getDaysInMonth(ym) {
      if (!ym || !/^\d{4}-\d{2}$/.test(ym)) return 30;
      const [y, m] = ym.split("-").map(Number);
      return new Date(y, m, 0).getDate();
    }

    function getVisibleStaff() {
      if (isDirectorOrVice()) return state.staff;
      const roleDept = getCurrentRoleObj().deptId;
      return state.staff.filter((s) => s.deptId === roleDept);
    }

    function getAttendanceMeta(code) {
      return ATTENDANCE_CODES.find((c) => c.code === code) || ATTENDANCE_CODES[5];
    }

    function getMealRecordForSelectedDate() {
      const d = state.selectedDate;
      if (!state.mealMovements[d]) {
        state.mealMovements[d] = {
          breakfast: 0,
          lunch: 0,
          dinner: 0,
          packetLunch: []
        };
      }
      if (!Array.isArray(state.mealMovements[d].packetLunch)) {
        state.mealMovements[d].packetLunch = [];
      }
      return state.mealMovements[d];
    }

    function getVisibleNotes() {
      const dayNotes = (state.serviceNotes || []).filter((n) => n.date === state.selectedDate);
      if (isDirectorOrVice()) return dayNotes;
      const myDept = getCurrentRoleObj().deptId;
      return dayNotes.filter((n) => {
        const targets = Array.isArray(n.targetDeptIds) ? n.targetDeptIds : [n.deptId];
        return targets.includes("all") || targets.includes(myDept);
      });
    }

    function formatPublishedBadge(dateStr, timeStr) {
      return `${dateStr || state.selectedDate} • ${timeStr || "--:--"}`;
    }

    function formatNoteRecipientsBadge(note) {
      const targets = Array.isArray(note.targetDeptIds) ? note.targetDeptIds : [note.deptId];
      if (targets.includes("all")) {
        return `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-950 border border-amber-300">Tutti i reparti</span>`;
      }
      return targets
        .map((id) => {
          const d = getDepartmentObj(id);
          return `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full border ${d.badgeClass}">${escapeHTML(d.name)}</span>`;
        })
        .join(" ");
    }

    function isEntryArchived(sourceRef) {
      return (state.archiveEntries || []).some((a) => a.sourceRef === sourceRef);
    }

    function pushUniqueArchiveEntry(entry) {
      if (!Array.isArray(state.archiveEntries)) state.archiveEntries = [];
      if (entry.sourceRef && isEntryArchived(entry.sourceRef)) return;
      state.archiveEntries.unshift({
        id: `arc_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        ...entry
      });
    }

    function computeDailyKPIs() {
      const ym = state.selectedMonth;
      const dayNum = Number((state.selectedDate || "").split("-")[2] || 1);
      const visibleStaff = getVisibleStaff();
      let presentCount = 0;
      visibleStaff.forEach((m) => {
        const code = state.monthlyAttendance[`${ym}__${m.id}__${dayNum}`];
        if (code === "P") presentCount++;
      });

      const rec = getMealRecordForSelectedDate();
      const totalMeals = Number(rec.breakfast || 0) + Number(rec.lunch || 0) + Number(rec.dinner || 0);
      const packetCount = Array.isArray(rec.packetLunch)
        ? rec.packetLunch.reduce((acc, item) => acc + Number(item.count || 0), 0)
        : 0;
      const openMaintenance = (state.maintenanceTickets || []).filter((t) => t.status !== "Completata").length;

      return {
        presentCount,
        totalStaff: visibleStaff.length,
        totalMeals,
        packetCount,
        openMaintenance
      };
    }

    const actions = {
      setLoginUsernameDraft(val) {
        state.loginUsernameDraft = val;
        if (state.loginError) state.loginError = "";
      },

      setLoginPasswordDraft(val) {
        state.loginPasswordDraft = val;
        if (state.loginError) state.loginError = "";
      },

      async submitInitialLogin(event) {
        event.preventDefault();
        syncSharedStateFromStorage();
        if (window.__cloudSync && typeof window.__cloudSync.pullLatest === "function") {
          await window.__cloudSync.pullLatest();
        }
        const userInput = (state.loginUsernameDraft || "").trim().toLowerCase();
        const passInput = state.loginPasswordDraft || "";
        if (!userInput) {
          state.loginError = "Inserisci il nome utente del settore.";
          render();
          return;
        }

        const matchedRole = ROLES.find((r) => {
          const secKey = getRoleSectorKey(r.id);
          const cred = getSectorCredential(secKey);
          return (cred.username || "").trim().toLowerCase() === userInput;
        });

        if (!matchedRole) {
          state.loginError = "Nome utente non riconosciuto.";
          render();
          return;
        }

        const secKey = getRoleSectorKey(matchedRole.id);
        const expectedPass = getSectorPassword(secKey);
        if (expectedPass && passInput !== expectedPass) {
          state.loginError = "Password non corretta per questo utente.";
          render();
          return;
        }

        state.activeRole = matchedRole.id;
        state.activeSection = null;
        state.isAuthenticated = true;
        state.loginPasswordDraft = "";
        state.loginError = "";
        saveState();
        render();
        showToast(`Benvenuto: ${matchedRole.label}`);
      },

      openSection(sectionId) {
        state.activeSection = sectionId;
        render();
      },

      goHome() {
        state.activeSection = null;
        render();
      },

      async manualSyncNow() {
        syncSharedStateFromStorage();
        if (window.__cloudSync) {
          if (!window.__cloudSync.isActive() && typeof window.__cloudSync.reconnect === "function") {
            await window.__cloudSync.reconnect();
          } else {
            if (typeof window.__cloudSync.pullLatest === "function") {
              await window.__cloudSync.pullLatest();
            }
            if (typeof window.__cloudSync.push === "function") {
              await window.__cloudSync.push();
            }
          }
        }
        render();
        showToast("Sincronizzazione completata");
      },

      logout() {
        state.isAuthenticated = false;
        state.activeSection = null;
        state.loginUsernameDraft = "";
        state.loginPasswordDraft = "";
        state.loginError = "";
        state.pendingRoleId = null;
        state.passwordDraft = "";
        state.passwordError = "";
        saveState();
        render();
      },

      async requestRoleChange(newRoleId) {
        if (newRoleId === state.activeRole) return;
        syncSharedStateFromStorage();
        if (window.__cloudSync && typeof window.__cloudSync.pullLatest === "function") {
          await window.__cloudSync.pullLatest();
        }
        const sectorKey = getRoleSectorKey(newRoleId);
        const expectedPass = getSectorPassword(sectorKey);
        if (!expectedPass) {
          state.activeRole = newRoleId;
          state.activeSection = null;
          state.pendingRoleId = null;
          state.passwordDraft = "";
          state.passwordError = "";
          saveState();
          render();
          showToast(`Profilo attivo: ${getCurrentRoleObj().label}`);
          return;
        }
        state.pendingRoleId = newRoleId;
        state.passwordDraft = "";
        state.passwordError = "";
        render();
      },

      cancelRoleChange() {
        state.pendingRoleId = null;
        state.passwordDraft = "";
        state.passwordError = "";
        render();
      },

      setPasswordDraft(val) {
        state.passwordDraft = val;
        if (state.passwordError) {
          state.passwordError = "";
        }
      },

      async confirmRoleChange(event) {
        event.preventDefault();
        if (!state.pendingRoleId) return;
        syncSharedStateFromStorage();
        if (window.__cloudSync && typeof window.__cloudSync.pullLatest === "function") {
          await window.__cloudSync.pullLatest();
        }
        const sectorKey = getRoleSectorKey(state.pendingRoleId);
        const expectedPass = getSectorPassword(sectorKey);
        if (state.passwordDraft === expectedPass) {
          state.activeRole = state.pendingRoleId;
          state.activeSection = null;
          state.pendingRoleId = null;
          state.passwordDraft = "";
          state.passwordError = "";
          saveState();
          render();
          showToast(`Accesso confermato: ${getCurrentRoleObj().label}`);
        } else {
          state.passwordError = "Password non corretta per questo settore. Riprova.";
          render();
        }
      },

      setCredentialDraft(sectorKey, field, val) {
        const currentCred = getSectorCredential(sectorKey);
        const existingDraft = state.credentialDraftsByKey[sectorKey] || {
          username: currentCred.username,
          password: currentCred.password
        };
        state.credentialDraftsByKey[sectorKey] = {
          ...existingDraft,
          [field]: val
        };
      },

      saveSectorCredential(sectorKey) {
        if (!isDirectorOrVice()) return;
        const currentCred = getSectorCredential(sectorKey);
        const draft = state.credentialDraftsByKey[sectorKey] || currentCred;
        const cleanUser = (draft.username || "").trim();
        const cleanPass = (draft.password || "").trim();
        if (!cleanUser) {
          showToast("Il nome utente non può essere vuoto", "warning");
          return;
        }
        const duplicate = Object.entries(state.sectorCredentials || {}).some(([k, v]) => {
          if (k === sectorKey) return false;
          const u = typeof v === "string" ? k : v?.username || k;
          return u.trim().toLowerCase() === cleanUser.toLowerCase();
        });
        if (duplicate) {
          showToast("Questo nome utente è già usato da un altro settore", "warning");
          return;
        }
        state.sectorCredentials[sectorKey] = {
          username: cleanUser,
          password: cleanPass
        };
        delete state.credentialDraftsByKey[sectorKey];
        saveState();
        render();
        showToast(
          cleanPass
            ? `Credenziali salvate per "${cleanUser}" (con password)`
            : `Utente "${cleanUser}" salvato senza password`
        );
      },

      clearSectorPassword(sectorKey) {
        if (!isDirectorOrVice()) return;
        const currentCred = getSectorCredential(sectorKey);
        state.sectorCredentials[sectorKey] = {
          username: currentCred.username,
          password: ""
        };
        delete state.credentialDraftsByKey[sectorKey];
        saveState();
        render();
        showToast("Password rimossa per questo settore");
      },

      setDate(newDate) {
        if (!newDate) return;
        state.selectedDate = newDate;
        state.selectedMonth = newDate.slice(0, 7);
        saveState();
        render();
      },

      setMonth(newMonth) {
        if (!newMonth) return;
        state.selectedMonth = newMonth;
        if (!state.selectedDate.startsWith(newMonth)) {
          state.selectedDate = `${newMonth}-01`;
        }
        saveState();
        render();
      },

      toggleEditAttendance() {
        state.editAttendanceMode = !state.editAttendanceMode;
        render();
      },

      setBrushCode(code) {
        state.selectedBrushCode = code;
        state.editAttendanceMode = true;
        render();
      },

      applyAttendanceCell(staffId, dayNum) {
        if (!state.editAttendanceMode) return;
        const key = `${state.selectedMonth}__${staffId}__${dayNum}`;
        if (state.selectedBrushCode === ".") {
          delete state.monthlyAttendance[key];
        } else {
          state.monthlyAttendance[key] = state.selectedBrushCode;
        }
        state.lastSelectedCell = { staffId, dayNum };

        render();

      fillColumnForDay(dayNum) {
        if (!state.editAttendanceMode) {
          showToast("Attiva prima la modalità Modifica presenze", "warning");
          return;
        }
        const visibleStaff = getVisibleStaff();
        visibleStaff.forEach((member) => {
          const key = `${state.selectedMonth}__${member.id}__${dayNum}`;
          if (state.selectedBrushCode === ".") {
            delete state.monthlyAttendance[key];
          } else {
            state.monthlyAttendance[key] = state.selectedBrushCode;
          }
        });
        saveState();
        render();

      addStaffMember(event) {
        event.preventDefault();
        if (!isDirectorOrVice()) {
          showToast("Solo Direttore e Vice Direttore possono inserire personale", "warning");
          return;
        }
        const form = event.target;
        const name = form.staffName.value.trim();
        const roleTitle = form.staffRole.value.trim();
        const deptId = form.staffDept.value || "ricevimento";
        if (!name || !roleTitle) {
          showToast("Inserisci nome e qualifica del collaboratore", "warning");
          return;
        }
        const newId = `st_${Date.now()}`;
        state.staff.push({ id: newId, name, role: roleTitle, deptId });
        form.reset();
        saveState();
        render();
        showToast(`${name} aggiunto a ${getDepartmentObj(deptId).name}`);
      },

      removeStaffMember(staffId) {
        if (!isDirectorOrVice()) {
          showToast("Solo Direttore e Vice Direttore possono eliminare personale", "warning");
          return;
        }
        const member = state.staff.find((s) => s.id === staffId);
        if (!member) return;
        state.staff = state.staff.filter((s) => s.id !== staffId);
        Object.keys(state.monthlyAttendance || {}).forEach((k) => {
          if (k.includes(`__${staffId}__`)) {
            delete state.monthlyAttendance[k];
          }
        });
        saveState();
        render();
        showToast(`${member.name} rimosso dall'organico`);

      toggleNoteAllDepts(checked) {

        if (state.noteSelectAllDepts) {
          state.noteSelectedDeptIds = DEPARTMENTS.map((d) => d.id);
        }
        render();
      },

      toggleNoteDeptSelection(deptId) {
        state.noteSelectAllDepts = false;
        const current = new Set(state.noteSelectedDeptIds || []);
        if (current.has(deptId)) {
          current.delete(deptId);
        } else {
          current.add(deptId);
        }
        state.noteSelectedDeptIds = Array.from(current);
        render();
      },

      addServiceNote(event) {
        event.preventDefault();
        const form = event.target;
        const text = form.noteText.value.trim();
        if (!text) return;

        let targetDeptIds = ["all"];
        if (isDirectorOrVice()) {
          if (state.noteSelectAllDepts) {
            targetDeptIds = ["all"];
          } else {
            const chosen = (state.noteSelectedDeptIds || []).filter((id) =>
              DEPARTMENTS.some((d) => d.id === id)
            );
            if (chosen.length === 0) {
              showToast("Seleziona almeno un reparto destinatario", "warning");
              return;
            }
            targetDeptIds = chosen.length === DEPARTMENTS.length ? ["all"] : chosen;
          }
        } else {
          const singleDept = getCurrentRoleObj().deptId || "ricevimento";
          targetDeptIds = [singleDept];
        }

        const nowTime = getCurrentTimeHHMM();
        const noteId = `note_${Date.now()}`;
        const author = getCurrentRoleObj().label;
        const recipientNames = targetDeptIds.includes("all")
          ? "Tutti i reparti"
          : targetDeptIds.map((id) => getDepartmentObj(id).name).join(", ");

        state.serviceNotes.unshift({
          id: noteId,
          date: state.selectedDate,
          time: nowTime,
          deptId: targetDeptIds[0],
          targetDeptIds,
          authorRole: author,
          text
        });

        pushUniqueArchiveEntry({
          sourceRef: `note:${noteId}`,
          category: "ordini_servizio",
          title: `Nota / Ordine di Servizio (${recipientNames})`,
          detail: text,
          date: state.selectedDate,
          time: nowTime,
          authorRole: author
        });

        form.reset();
        saveState();
        render();
        showToast("Nota pubblicata e salvata nell'archivio Direzione");
      },

      deleteServiceNote(noteId) {
        state.serviceNotes = state.serviceNotes.filter((n) => n.id !== noteId);
        saveState();
        render();
        showToast("Nota rimossa");
      },

      updateMealCount(field, rawValue) {
        const rec = getMealRecordForSelectedDate();
        rec[field] = Math.max(0, parseInt(rawValue, 10) || 0);
        const nowTime = getCurrentTimeHHMM();
        const total = Number(rec.breakfast || 0) + Number(rec.lunch || 0) + Number(rec.dinner || 0);
        const packetTotal = Array.isArray(rec.packetLunch)
          ? rec.packetLunch.reduce((acc, item) => acc + Number(item.count || 0), 0)
          : 0;
        const sourceRef = `meal_mov:${state.selectedDate}`;
        const detailText = `Colazioni: ${rec.breakfast} • Pranzi: ${rec.lunch} • Cene: ${rec.dinner} (Totale pasti: ${total} • Packet Lunch: ${packetTotal})`;
        const existingIdx = (state.archiveEntries || []).findIndex((a) => a.sourceRef === sourceRef);
        if (existingIdx >= 0) {
          state.archiveEntries[existingIdx] = {
            ...state.archiveEntries[existingIdx],
            time: nowTime,
            detail: detailText,
            authorRole: getCurrentRoleObj().label
          };
        } else {
          pushUniqueArchiveEntry({
            sourceRef,
            category: "movimento_pasti",
            title: `Movimento Pasti (${state.selectedDate})`,
            detail: detailText,
            date: state.selectedDate,
            time: nowTime,
            authorRole: getCurrentRoleObj().label
          });
        }
        saveState();
        render();

        });

      addMaintenanceTicket(event) {

        if (isMaintenanceRole()) {
          showToast("I manutentori possono solo leggere e risolvere gli interventi", "warning");
          return;

        if (!roomOrArea || !issue) return;

        const mntId = `mnt_${Date.now()}`;

          date: state.selectedDate,
          time: nowTime,
          roomOrArea,
          issue,
          status: "Aperta"
        });
        pushUniqueArchiveEntry({
          sourceRef: `mnt:${mntId}`,
          category: "manutenzione_ospiti",
          title: `Manutenzione: ${roomOrArea}`,
          detail: `${issue} — Stato: Aperta`,
          date: state.selectedDate,
          time: nowTime,
          authorRole: author
        });
        form.reset();
        saveState();
        render();
        showToast("Richiesta manutenzione registrata e archiviata");
      },

      cycleMaintenanceStatus(ticketId) {
        const order = ["Aperta", "In corso", "Completata"];
        const ticket = state.maintenanceTickets.find((t) => t.id === ticketId);
        if (!ticket) return;
        const nextIdx = (order.indexOf(ticket.status) + 1) % order.length;
        ticket.status = order[nextIdx];
        const archived = (state.archiveEntries || []).find((a) => a.sourceRef === `mnt:${ticketId}`);
        if (archived) {
          archived.detail = `${ticket.issue} — Stato: ${ticket.status}`;
        }
        saveState();
        render();
        showToast(`Stato manutenzione: ${ticket.status}`);

        const detail = form.cmpDetail.value.trim();
        if (!roomOrGuest || !detail) return;

        const cmpId = `cmp_${Date.now()}`;

        });

        saveState();

        if (!cmp) return;
        const order = ["Aperta", "In lavorazione", "Risolta"];

      resetArchiveFilters() {

        state.archiveDateFilter = "";
        render();

      quickArchiveFromItem(type, itemId) {
        if (!isDirectorOrVice() || isArchivingInProgress) return;
        const sourceRef = `${type}:${itemId}`;
        if (isEntryArchived(sourceRef)) {
          showToast("Elemento già presente in archivio", "warning");
          return;
        }
        isArchivingInProgress = true;
        try {
          if (type === "note") {
            const note = state.serviceNotes.find((n) => n.id === itemId);
            if (!note) return;
            pushUniqueArchiveEntry({
              sourceRef,
              category: "ordini_servizio",
              title: `Ordine di Servizio (${note.authorRole})`,
              detail: note.text,
              date: note.date,
              time: note.time || getCurrentTimeHHMM(),
              authorRole: note.authorRole
            });
          } else if (type === "room_change") {
            const rc = state.roomChangeNotices.find((r) => r.id === itemId);
            if (!rc) return;
            pushUniqueArchiveEntry({
              sourceRef,
              category: "cambi_camera",
              title: `Cambio Cam. ${rc.fromRoom} → Cam. ${rc.toRoom}`,
              detail: rc.note,
              date: rc.date,
              time: rc.time || getCurrentTimeHHMM(),
              authorRole: rc.authorRole
            });
          } else if (type === "intolerance") {
            const item = state.intoleranceNotices.find((i) => i.id === itemId);
            if (!item) return;
            pushUniqueArchiveEntry({
              sourceRef,
              category: "pasti_intolleranze",
              title: `Intolleranza Cam. ${item.room}`,
              detail: item.detail,
              date: item.date,
              time: item.time || getCurrentTimeHHMM(),
              authorRole: item.authorRole
            });
          }
          saveState();
          render();
          showToast("Salvato in Archivio Direzione");
        } finally {
          isArchivingInProgress = false;
        }
      },

      deleteArchiveEntry(entryId) {
        if (!isDirectorOrVice()) return;
        state.archiveEntries = state.archiveEntries.filter((a) => a.id !== entryId);
        saveState();
        render();
        showToast("Voce archivio rimossa");
      }
    };

                />
                ${

                }
              </div>
              <div class="flex items-center justify-end gap-2 pt-1">
                <button type="button" onclick="actions.cancelRoleChange()" class="press-btn px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold text-slate-700 hover:bg-slate-50">

                  <input name="toRoom" type="text" placeholder="A Camera (es. 412)" class="rounded-xl border border-teal-300 bg-white px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-teal-500" />

              </div>

          </div>

            </div>

                <input name="cmpDetail" type="text" placeholder="Dettaglio segnalazione o richiesta..." class="sm:col-span-5 rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-amber-500" />

    function renderArchiveSection() {
      if (!isDirectorOrVice()) {
        return `
          <div>
            ${renderSectionTopBar("Accesso Riservato", "Archivio disponibile esclusivamente per Direttore e Vice Direttore")}
            <div class="bg-white border border-slate-200 rounded-2xl p-6 text-sm text-slate-600">
              Non hai i permessi per visualizzare questa sezione.
            </div>
          </div>
        `;
      }

      const activeCat = state.archiveFilterCategory;
      const activeCatMeta = activeCat ? ARCHIVE_CATEGORIES.find((c) => c.id === activeCat) : null;
      const searchQ = (state.archiveSearchQuery || "").trim().toLowerCase();
      const dateFilter = state.archiveDateFilter || "";

      const countsByCat = {};
      ARCHIVE_CATEGORIES.forEach((cat) => {
        countsByCat[cat.id] = 0;
      });
      (state.archiveEntries || []).forEach((entry) => {
        if (countsByCat[entry.category] !== undefined) {
          countsByCat[entry.category]++;
        }
      });

      const filteredFolderEntries = activeCat
        ? (state.archiveEntries || []).filter((entry) => {
            if (entry.category !== activeCat) return false;
            if (dateFilter && entry.date !== dateFilter) return false;
            if (searchQ) {
              const hay = `${entry.title} ${entry.detail} ${entry.authorRole} ${entry.date} ${entry.time || ""}`.toLowerCase();
              if (!hay.includes(searchQ)) return false;
            }
            return true;
          })
        : [];

      const groupedByDate = {};
      filteredFolderEntries.forEach((entry) => {
        const dKey = entry.date || getTodayISO();
        if (!groupedByDate[dKey]) groupedByDate[dKey] = [];
        groupedByDate[dKey].push(entry);
      });
      const sortedDateKeys = Object.keys(groupedByDate).sort((a, b) => b.localeCompare(a));

      return `
        <div>
          ${renderSectionTopBar(
            "Archivio Direzione",
            "Clicca su un riquadro per aprire la cartella e clicca di nuovo sullo stesso riquadro per chiuderla."
          )}

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 mb-6">
            ${ARCHIVE_CATEGORIES.map((cat) => {
              const isOpen = activeCat === cat.id;
              return `
                <button
                  type="button"
                  onclick="actions.toggleArchiveFolderTile('${cat.id}')"
                  class="press-btn text-left rounded-2xl border p-4 transition-all ${
                    isOpen
                      ? "bg-slate-900 text-white border-slate-900 shadow-md ring-2 ring-amber-400"
                      : "bg-white/95 hover:bg-white text-slate-900 border-slate-200/90 hover:border-amber-300 shadow-xs"
                  }"
                >
                  <div class="flex items-center justify-between gap-2 mb-2.5">
                    <span class="text-xl">${cat.icon}</span>
                    <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full border ${
                      isOpen ? "bg-amber-400 text-slate-950 border-amber-300" : cat.badgeClass
                    }">
                      ${countsByCat[cat.id] || 0} voci
                    </span>
                  </div>
                  <p class="text-sm font-extrabold leading-snug">${escapeHTML(cat.label)}</p>
                  <p class="text-[11px] mt-1 ${isOpen ? "text-amber-300 font-semibold" : "text-slate-500"}">
                    ${isOpen ? "Clicca di nuovo per chiudere" : "Clicca per aprire cartella"}
                  </p>
                </button>
              `;
            }).join("")}
          </div>

          ${
            activeCat && activeCatMeta
              ? `
                <div class="bg-white/95 border border-slate-200/90 rounded-2xl p-5 sm:p-6 shadow-xs space-y-5">
                  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pb-4 border-b border-slate-200">
                    <div class="flex items-center gap-2.5">
                      <span class="text-2xl">${activeCatMeta.icon}</span>
                      <div>
                        <h3 class="text-base sm:text-lg font-extrabold text-slate-900">${escapeHTML(activeCatMeta.label)}</h3>
                        <p class="text-xs text-slate-500">${filteredFolderEntries.length} voci archiviate • divise per data e orario</p>
                      </div>
                    </div>
                    <button
                      type="button"
                      onclick="actions.toggleArchiveFolderTile('${activeCat}')"
                      class="press-btn px-3.5 py-1.5 rounded-xl border border-slate-300 bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-800 self-start sm:self-auto"
                    >
                      ✕ Chiudi cartella
                    </button>
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5 bg-slate-50 border border-slate-200 rounded-xl p-3">
                    <div class="sm:col-span-6">
                      <input
                        type="text"
                        value="${escapeHTML(state.archiveSearchQuery)}"
                        oninput="actions.setArchiveSearchQuery(this.value)"
                        placeholder="Cerca per parola chiave, camera, orario o autore..."
                        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                    <div class="sm:col-span-4">
                      <input
                        type="date"
                        value="${escapeHTML(state.archiveDateFilter)}"
                        onchange="actions.setArchiveDateFilter(this.value)"
                        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                    <div class="sm:col-span-2">
                      <button
                        type="button"
                        onclick="actions.resetArchiveFilters()"
                        class="press-btn w-full h-full rounded-xl border border-slate-300 bg-white hover:bg-slate-100 text-xs font-bold text-slate-700 py-2 px-3"
                      >
                        Reset
                      </button>
                    </div>
                  </div>

                  ${
                    sortedDateKeys.length === 0
                      ? `<div class="rounded-xl border border-dashed border-slate-300 p-8 text-center text-xs text-slate-500">Nessuna voce trovata in questa cartella con i filtri attuali.</div>`
                      : `<div class="space-y-5 max-h-[520px] overflow-y-auto pr-1">
                          ${sortedDateKeys
                            .map((dateKey) => {
                              const dayItems = groupedByDate[dateKey];
                              return `
                                <div class="space-y-2.5">
                                  <div class="flex items-center gap-2">
                                    <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-slate-900 text-white">📅 ${escapeHTML(dateKey)}</span>
                                    <span class="text-[11px] font-semibold text-slate-500">${dayItems.length} ${dayItems.length === 1 ? "voce" : "voci"}</span>
                                  </div>
                                  <div class="space-y-2 pl-1 sm:pl-2 border-l-2 border-amber-300">
                                    ${dayItems
                                      .map(
                                        (entry) => `
                                          <div class="rounded-xl border border-slate-200/90 bg-white p-3.5 shadow-2xs flex items-start justify-between gap-3">
                                            <div>
                                              <div class="flex items-center gap-2 flex-wrap mb-1">
                                                <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-md bg-amber-100 text-amber-950 border border-amber-300">🕒 ${escapeHTML(entry.time || "--:--")}</span>
                                                <span class="text-[11px] font-semibold text-slate-500">da <strong>${escapeHTML(entry.authorRole)}</strong></span>
                                              </div>
                                              <h4 class="text-sm font-extrabold text-slate-900">${escapeHTML(entry.title)}</h4>
                                              <p class="text-xs text-slate-700 mt-0.5 leading-relaxed">${escapeHTML(entry.detail)}</p>
                                            </div>
                                            <button type="button" onclick="actions.deleteArchiveEntry('${entry.id}')" class="text-xs text-slate-400 hover:text-rose-600 font-semibold shrink-0" title="Elimina dall'archivio">
                                              Elimina
                                            </button>
                                          </div>
                                        `
                                      )
                                      .join("")}
                                  </div>
                                </div>
                              `;
                            })
                            .join("")}
                        </div>`
                  }
                </div>
              `
              : ""
          }
        </div>
      `;
    }

    function renderSecuritySection() {
      if (!isDirectorOrVice()) {
        return `
          <div>
            ${renderSectionTopBar("Accesso Riservato", "Questa sezione è riservata esclusivamente a Direttore e Vice Direttore.")}
            <div class="bg-white border border-slate-200 rounded-2xl p-6 text-sm text-slate-600">

            </div>
          </div>

      }

      const sectors = [
        { key: "director", label: "Direttore", badgeClass: "bg-amber-100 text-amber-950 border-amber-300" },
        { key: "vice_director", label: "Vice Direttore", badgeClass: "bg-amber-100 text-amber-950 border-amber-300" },
        ...DEPARTMENTS.filter((d) => d.id !== "direzione").map((d) => ({
          key: d.id,
          label: `Capo ${d.name}`,
          badgeClass: d.badgeClass
        }))
      ];

      return `
        <div>
          ${renderSectionTopBar(
            "Credenziali & Sicurezza Settori",
            "Configura nome utente e password di accesso iniziale e cambio profilo per ogni reparto."
          )}

          <div class="bg-white/95 border border-slate-200/90 rounded-2xl p-5 sm:p-6 shadow-xs">
            <div class="mb-5">
              <h3 class="text-base sm:text-lg font-extrabold text-slate-900">Utenti e Password dei Settori</h3>
              <p class="text-xs sm:text-sm text-slate-500 mt-0.5">
                Ogni settore effettua l'accesso iniziale con il proprio <strong>Nome Utente</strong> e la relativa <strong>Password</strong> (se impostata).
              </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
              ${sectors
                .map((sec) => {
                  const savedCred = getSectorCredential(sec.key);
                  const isProtected = Boolean(savedCred.password);
                  const draft = state.credentialDraftsByKey[sec.key] || {
                    username: savedCred.username,
                    password: savedCred.password
                  };

                  return `
                    <div class="rounded-2xl border border-slate-200/90 bg-slate-50/70 p-4 flex flex-col justify-between gap-3">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-bold px-2.5 py-1 rounded-full border ${sec.badgeClass}">${escapeHTML(sec.label)}</span>
                        <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${isProtected ? "bg-emerald-100 text-emerald-900 border border-emerald-300" : "bg-slate-200 text-slate-600"}">
                          ${isProtected ? "🔒 Protetto" : "Senza password"}
                        </span>
                      </div>

                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                          <label class="block text-[11px] font-bold text-slate-600 mb-1">Nome Utente</label>
                          <input
                            type="text"
                            value="${escapeHTML(draft.username)}"
                            oninput="actions.setCredentialDraft('${sec.key}', 'username', this.value)"
                            placeholder="Utente..."
                            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500"
                          />
                        </div>
                        <div>
                          <label class="block text-[11px] font-bold text-slate-600 mb-1">Password</label>
                          <input
                            type="text"
                            value="${escapeHTML(draft.password)}"
                            oninput="actions.setCredentialDraft('${sec.key}', 'password', this.value)"
                            placeholder="Nessuna password..."
                            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500"
                          />
                        </div>
                      </div>

                      <div class="flex items-center justify-end gap-2">
                        ${
                          isProtected
                            ? `<button type="button" onclick="actions.clearSectorPassword('${sec.key}')" class="press-btn px-3 py-1.5 rounded-xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold">Rimuovi pwd</button>`
                            : ""
                        }
                        <button type="button" onclick="actions.saveSectorCredential('${sec.key}')" class="press-btn px-3.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold">
                          Salva credenziali
                        </button>
                      </div>
                    </div>
                  `;
                })
                .join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderActiveSection() {
      switch (state.activeSection) {
        case "presenze":
          return renderAttendanceSection();
        case "pasti":
          return renderMealMovementsSection();
        case "note":
          return renderServiceNotesSection();
        case "manutenzione":
          return renderMaintenanceAndComplaintsSection();
        case "personale_direzione":
          return renderStaffManagementSection();
        case "archivio":
          return renderArchiveSection();
        case "sicurezza":
          return renderSecuritySection();
        default:
          return renderHomeMenu();
      }
    }

    function render() {
      const app = document.getElementById("app");
      if (!app) return;

      if (!state.isAuthenticated) {
        app.innerHTML = renderLoginScreen();
        return;
      }

      app.innerHTML = `
        ${renderHeader()}
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
          ${renderActiveSection()}
        </main>
        <footer class="border-t border-slate-200/80 bg-white/80 py-3.5 px-4 text-center text-xs text-slate-500">
          Grand Hotel — Capi Servizio Hub • Coordinamento reparti &amp; Direzione
        </footer>
        ${renderRoleLockModal()}
      `;

      if (state.pendingRoleId) {
        const pwdInput = document.getElementById("role-password-input");
        if (pwdInput) pwdInput.focus();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      render();
    });
  </script>
</body>
</html>
